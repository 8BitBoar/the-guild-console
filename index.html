<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>The Guild Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b1a'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23d9b25a'/%3E%3Cpath d='M22 32c-6-1-12-5-16-11 5 2 10 3 15 3-4-1-8-3-11-6 4 1 9 2 13 2' fill='none' stroke='%23d9b25a' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M42 32c6-1 12-5 16-11-5 2-10 3-15 3 4-1 8-3 11-6-4 1-9 2-13 2' fill='none' stroke='%23d9b25a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#070b1a; --bg2:#0b1128; --panel:rgba(13,19,42,.86); --panel2:rgba(20,28,58,.9);
  --line:rgba(217,178,90,.22); --line2:rgba(217,178,90,.45);
  --gold:#d9b25a; --gold2:#f1d48c; --text:#ebe6d6; --muted:#97a0b6; --dim:#6b7390;
  --teal:#45b8a9; --amber:#e8a33c; --red:#e2645c; --violet:#8f7ee0; --navy:#253F79;
  --r:12px; --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 12px 40px}
a{color:var(--gold2)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0}
h2{font-size:1.25rem;color:var(--gold2)}
h3{font-size:1.02rem;color:var(--gold)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.84rem}
.gold{color:var(--gold2)} .warn{color:var(--amber)} .bad{color:var(--red)} .good{color:var(--teal)}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:20;margin:0 -12px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,rgba(7,11,26,.97),rgba(7,11,26,.9));border-bottom:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{width:34px;height:22px;flex:none}
.brand b{font-family:var(--serif);font-size:1.05rem;color:var(--gold2);white-space:nowrap}
.sync{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none;border:0;padding:0;cursor:pointer}
.sync.ok{background:var(--teal)} .sync.dirty{background:var(--amber)} .sync.busy{background:var(--gold2);animation:pulse 1s infinite} .sync.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.clock{margin-left:auto;text-align:right;line-height:1.15}
.clock .d{font-size:.8rem;color:var(--muted)}
.clock .t{font-family:var(--mono);font-size:1.15rem;color:var(--text)}
.clock.late .t{color:var(--amber)} .clock.over .t{color:var(--red)}
.clock .lw{font-size:.7rem;color:var(--amber)}
.stats{margin-top:7px;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:.8rem;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:600;color:var(--gold2)}
.chip.stage{border-color:var(--line2);color:var(--gold2)}
.lvl{display:flex;align-items:center;gap:6px;flex:1 1 150px;min-width:150px}
.bar{position:relative;height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;flex:1}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.bar.teal>i{background:linear-gradient(90deg,#2d8e83,var(--teal))}
.bar.violet>i{background:linear-gradient(90deg,#5e50b0,var(--violet))}
.iconbtn{position:relative;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:3px 9px;font-size:.8rem;cursor:pointer}
.iconbtn .n{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:9px;background:var(--red);color:#fff;font-size:.65rem;line-height:16px;text-align:center;padding:0 4px}

/* ---------- tabs ---------- */
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:8px -12px 0;padding:0 12px 2px}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 11px;border-radius:999px;font-size:.86rem;cursor:pointer}
#tabs button.on{color:var(--bg);background:var(--gold);font-weight:600}
#tabs button:not(.on):hover{border-color:var(--line)}

/* ---------- panels ---------- */
#view{padding-top:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative}
.panel+.panel{margin-top:12px}
.grid .panel+.panel{margin-top:0}
.panel>h2,.panel>h3{margin-bottom:8px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.hd h2,.hd h3{margin:0}
.soon{border-style:dashed;border-color:rgba(217,178,90,.18);background:rgba(13,19,42,.55)}
.soon .tag{font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid rgba(217,178,90,.1);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right;font-family:var(--mono)}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
ul.plain{margin:0;padding-left:18px} ul.plain li{margin:2px 0}

/* ---------- controls ---------- */
button.btn,.btn{appearance:none;background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:8px 13px;font:inherit;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;border-color:var(--gold2);font-weight:600}
.btn.danger{border-color:rgba(226,100,92,.6);color:#ffb3ad}
.btn.small{padding:5px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label.f{display:block;font-size:.82rem;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;background:rgba(5,8,20,.75);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#endDay{white-space:nowrap}

/* ---------- cards ---------- */
.cardrow{display:flex;gap:10px;flex-wrap:wrap}
.gcard{width:150px;min-height:200px;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(160deg,#141c3c,#0a0f24);border:1px solid var(--line2);position:relative;overflow:hidden}
.gcard::after{content:"";position:absolute;inset:4px;border:1px solid rgba(217,178,90,.15);border-radius:9px;pointer-events:none}
.gcard .rar{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase}
.gcard .nm{font-family:var(--serif);font-size:.98rem;color:var(--gold2);line-height:1.2}
.gcard .meta{font-size:.74rem;color:var(--muted);margin-top:auto}
.gcard .ct{position:absolute;top:8px;right:9px;font-family:var(--mono);font-size:.75rem;color:var(--gold2)}
.r-C{color:#b8bfcf} .r-U{color:#62c7b8} .r-R{color:#e3b955} .r-M{color:#e07a5f}
.gcard.core{border-color:var(--gold2);box-shadow:0 0 18px rgba(217,178,90,.15) inset}

/* ---------- foundation ---------- */
.track{display:flex;flex-direction:column;gap:4px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid rgba(217,178,90,.1)}
.step .k{font-family:var(--mono);color:var(--dim);text-align:center}
.step.un{border-color:var(--line2);background:rgba(217,178,90,.06)} .step.un .k{color:var(--gold2)}
.step.live{border-color:rgba(69,184,169,.5)} .step.live .k{color:var(--teal)}
.step .s{font-size:.76rem;color:var(--muted)}
.pill{font-size:.7rem;font-family:var(--mono);padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{color:var(--gold2);border-color:var(--line2)} .pill.live{color:var(--teal);border-color:rgba(69,184,169,.5)}

/* ---------- journal ---------- */
.jr{display:grid;grid-template-columns:70px 1fr;gap:2px 10px;font-size:.88rem}
.jr .tm{font-family:var(--mono);color:var(--dim);font-size:.8rem;padding-top:1px}
.jr .tx .c{font-size:.68rem;font-family:var(--mono);color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-right:5px}
.jday{font-family:var(--serif);color:var(--gold2);margin:12px 0 4px;grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:2px}
pre.md{white-space:pre-wrap;word-break:break-word;background:rgba(5,8,20,.75);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.5 var(--mono);max-height:60vh;overflow:auto;margin:0}

/* ---------- gauge ---------- */
.gauge{position:relative;height:16px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin:8px 0 4px}
.gauge i{position:absolute;top:0;bottom:0;left:0}
.gauge .safe{background:rgba(69,184,169,.22);border-right:2px solid var(--teal)}
.gauge .act{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.legend{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);font-family:var(--mono)}

/* ---------- modal / toast ---------- */
#modal:empty{display:none}
.mback{position:fixed;inset:0;z-index:50;background:rgba(3,5,12,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media(min-width:640px){.mback{align-items:center}}
.mbox{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:linear-gradient(180deg,#111938,#0a0f24);border:1px solid var(--line2);border-radius:16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.mbox .hd{position:sticky;top:-16px;background:#111938;margin:-16px -16px 10px;padding:14px 16px 8px;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
#toast div{background:#151d40;border:1px solid var(--line2);color:var(--text);padding:9px 14px;border-radius:10px;font-size:.88rem;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.note{border-left:3px solid var(--gold);padding:8px 10px;background:rgba(217,178,90,.06);border-radius:0 8px 8px 0;margin:6px 0}
.note.read{border-left-color:var(--dim);opacity:.75}
.note b{font-family:var(--serif);color:var(--gold2)}

footer{text-align:center;margin-top:26px;font-size:.8rem;color:var(--dim)}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
.hello{font-family:var(--mono);color:var(--gold2);letter-spacing:.04em}
.first{max-width:520px;margin:26px auto 0;text-align:center}
.first .seal{width:140px;height:90px;margin:4px auto 10px;display:block}
@media(max-width:520px){.grid{grid-template-columns:1fr}.clock .t{font-size:1.05rem}.brand b{font-size:.98rem}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <footer><span>The Guild Console · Akh Runtime · milestone 1</span> · <button id="creditsLink">Credits &amp; licenses</button></footer>
</div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ================================================================

const BUILD={milestone:1,version:"0.1.0"};
const DEFAULT_CARDS={"version":1,"notes":"Card catalog for The Guild Console. Rarity: C/U/R/M. 'defaults' lists values the dump doc didn't set. Core cards are granted by the Foundation track and never drop from packs. Add new cards anywhere in the list; ids must be unique.","cards":[{"id":"adventurer-registration","name":"Adventurer Registration","pack":"Core","rarity":"U","category":"System","core":true,"step":0,"unlocks":"Awakening scene","effect":{"type":"core","turnsOn":"Members can exist; HUD"}},{"id":"membership-and-subscriptions","name":"Membership and Subscriptions","pack":"Core","rarity":"U","category":"System","core":true,"step":1,"unlocks":"Registration deployed","effect":{"type":"core","turnsOn":"Subscriber sim, dues"}},{"id":"phoenix-downs","name":"Phoenix Downs","pack":"Core","rarity":"R","category":"System","core":true,"step":2,"unlocks":"Membership deployed or Concept Level 2","effect":{"type":"core","turnsOn":"Down sales"}},{"id":"quest-registry","name":"Quest Registry","pack":"Core","rarity":"U","category":"System","core":true,"step":3,"unlocks":"Concept Level 3","effect":{"type":"core","turnsOn":"Planes' quest sim, Registry fees (includes the basic Party Board)"}},{"id":"chat","name":"Chat","pack":"Core","rarity":"C","category":"System","core":true,"step":4,"unlocks":"Quest Registry deployed","effect":{"type":"core","turnsOn":"Flavor"}},{"id":"guild-shop","name":"Guild Shop","pack":"Core","rarity":"U","category":"System","core":true,"step":5,"unlocks":"Concept Level 4","effect":{"type":"core","turnsOn":"Shop sim"}},{"id":"safe-zones","name":"Safe Zones","pack":"Core","rarity":"R","category":"System","core":true,"step":6,"unlocks":"Phoenix Downs deployed + Concept Level 5","effect":{"type":"core","turnsOn":"Anchors become an attack vector"}},{"id":"waystones","name":"Waystones","pack":"Core","rarity":"R","category":"System","core":true,"step":7,"unlocks":"Concept Level 6","effect":{"type":"core","turnsOn":"Waystone trips, Waystone fees"}},{"id":"guild-inn-and-tavern","name":"Guild Inn and Tavern","pack":"Core","rarity":"M","category":"System","core":true,"step":8,"unlocks":"Safe Zones deployed","effect":{"type":"core","turnsOn":"Inn sim, Inn direct costs"}},{"id":"housing-plane","name":"Housing Plane","pack":"Core","rarity":"M","category":"System","core":true,"step":9,"unlocks":"GIT deployed + Concept Level 8","effect":{"type":"core","turnsOn":"Housing sim (Guild Commons)"}},{"id":"antivirus","name":"Antivirus","pack":"Core","rarity":"U","category":"System","core":true,"step":"special","unlocks":"First Virus detected","effect":{"type":"core","turnsOn":"Auto-quarantine, detection at 25%"}},{"id":"moar-servers","name":"MOAR SERVERS!!!","pack":"Perk","rarity":"U","category":"Perk","repeatable":true,"effect":{"type":"capacity","ranks":[50,250,2500,25000,1000000],"authority":[2,4,6,8,10]},"flavor":"The solution to insufficient infrastructure is obviously more infrastructure.","defaults":["rarity"]},{"id":"pest-control","name":"PEST CONTROL","pack":"Perk","rarity":"U","category":"Perk","repeatable":true,"effect":{"type":"bugThreshold","perRank":5},"defaults":["rarity"]},{"id":"remastered","name":"REMASTERED","pack":"Perk","rarity":"M","category":"Perk","repeatable":true,"effect":{"type":"versionBonusCap","perRank":0.02,"hoursPerRank":24},"flavor":"Same game. Better everything."},{"id":"ship-it","name":"SHIP IT!","pack":"Perk","rarity":"U","category":"Perk","repeatable":false,"effect":{"type":"devTime","tag":"Expansion","pct":0.1},"defaults":["rarity"]},{"id":"asset-reuse","name":"ASSET REUSE","pack":"Perk","rarity":"C","category":"Perk","repeatable":true,"effect":{"type":"devTime","category":"Item","pctPerRank":0.05},"defaults":["rarity"]},{"id":"inheritance","name":"INHERITANCE","pack":"Perk","rarity":"U","category":"Perk","repeatable":true,"effect":{"type":"devTime","category":"Class","pctPerRank":0.1},"defaults":["rarity"]},{"id":"quality-assurance","name":"QUALITY ASSURANCE","pack":"Perk","rarity":"U","category const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtN=(n,d=0)=>Number(n||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtCr=n=>{const v=Math.round((n||0)*100)/100;return fmtN(v,Number.isInteger(v)?0:2)+" Cr"};

function download(name,text,type="application/json"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}

/* ---------------- dates and time ---------------- */
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const parseISO=iso=>{const [y,m,d]=iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const isoOf=dt=>dt.toISOString().slice(0,10);
const addDays=(iso,n)=>{const d=parseISO(iso);d.setUTCDate(d.getUTCDate()+n);return isoOf(d)};
const fmtDate=iso=>parseISO(iso).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
const fmtDateLong=iso=>parseISO(iso).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric",timeZone:"UTC"});
const monthKey=iso=>iso.slice(0,7);
const fmtMonth=key=>{const [y,m]=key.split("-").map(Number);return MONTHS[m-1]+" "+y};
function fmtTime(min){min=Math.round(min);const day=Math.floor(min/1440);let m=min%1440;const h=Math.floor(m/60),mm=m%60;const ap=h<12?"AM":"PM";const h12=h%12||12;return `${h12}:${String(mm).padStart(2,"0")} ${ap}`+(day>0?` (+${day}d)`:"")}
function fmtDur(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h&&m?`${h} hr ${m} min`:h?`${h} hr`+(h>1?"s":""):`${m} min`}

/* ---------------- shared helpers (Build Spec §1) ---------------- */
/** Days in the month of an ISO date. Monthly rates are always divided by this. */
function daysInMonth(iso){const d=parseISO(iso);return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()}
function hashStr(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0)*4294967296+(h1>>>0)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
/** Seeded random stream for the current date and a roll label. Same save + date + label = same numbers, every time. */
function rng(label,date){return mulberry32(hashStr(`${S.seed}|${date||S.date}|${label}`)%4294967296)}
/** Bucket / percent-overflow roll: whole part guaranteed, fractional remainder rolled. */
function rollCount(expected,r){if(!(expected>0))return 0;const w=Math.floor(expected),f=expected-w;return w+((r||Math.random)()<f?1:0)}
/** Pick one key from a weight table; zero weights drop out and the rest renormalize. */
function weightedPick(weights,r){const ks=Object.keys(weights).filter(k=>weights[k]>0);const tot=ks.reduce((s,k)=>s+weights[k],0);if(!tot)return null;let x=(r||Math.random)()*tot;for(const k of ks){x-=weights[k];if(x<0)return k}return ks[ks.length-1]}

/** Fill in anything a newer build added, without touching what's already there. */
function migrate(s){
  const base=freshState(s.date||s.startDate||"2026-08-11");
  const fill=(dst,src)=>{for(const k in src){if(!(k in dst))dst[k]=JSON.parse(JSON.stringify(src[k]));else if(src[k]&&typeof src[k]==="object"&&!Array.isArray(src[k])&&dst[k]&&typeof dst[k]==="object"&&!Array.isArray(dst[k]))fill(dst[k],src[k])}};
  const keepSeed=s.seed;fill(s,base);if(keepSeed)s.seed=keepSeed;
  s.meta.schema=1;s.meta.milestone=BUILD.milestone;
  return s;
}

/** Real minutes an action of `mins` nominal minutes takes, starting now (after 9 PM, work runs 25% slower). */
function actionCost(mins){const {lateStart,lateMult}=C();let t=S.time,left=mins,real=0;
  while(left>1e-9){if(t>=lateStart){real+=left*lateMult;left=0;break}const before=Math.min(left,lateStart-t);real+=before;t+=before;left-=before}
  return Math.round(real)}
/** Spend time on a tool action. Returns the real minutes used. */
function spend(mins,text,cat){const real=actionCost(mins);const at=S.time;S.time+=real;if(text)log(text+(real!==mins?` (${fmtDur(real)} — late penalty)`:""),cat,at);return real}
/** Story scenes move the clock by hand, with no late penalty. */
function scene(hours,note){const m=Math.round(hours*60);const at=S.time;S.time+=m;log(`Scene (${fmtDur(m)})${note?": "+note:""}`,"Story",at)}

/* ================================================================
   END DAY (Build Spec §7). Steps switch on in later milestones.
   ================================================================ */
let ending=false;
function endDay(){
  if(ending||!S)return;
  if(S.time<C().dayEnd-180&&!confirm(`End ${fmtDate(S.date)} at ${fmtTime(S.time)}?`))return;
  ending=true;
  try{
    const date=S.date;
    // 0. Guard: a date is never processed twice.
    if(S.processedDates.includes(date)){toast("This date was already processed.");return}
    const rep={date,endedAt:S.time,sections:{}};
    const line=(sec,t)=>(rep.sections[sec]=rep.sections[sec]||[]).push(t);
    // 1. Runtime security ........ milestone 6
    // 2. Subscribers ............. milestone 7
    // 3. Planes and quests ....... milestone 8
    // 4. Earned revenue .......... milestone 9
    // 5. Daily costs ............. milestone 10
    // 6. Month close ............. milestone 10 (book totals roll over now)
    const next=addDays(date,1);
    if(monthKey(next)!==monthKey(date)){
      line("Money",`${fmtMonth(monthKey(date))} closed. Revenue ${fmtCr(S.money.monthRevenue)}, expenses ${fmtCr(S.money.monthExpense)}.`);
      S.money.monthRevenue=0;S.money.monthExpense=0;
    }
    // 7. Wrap-up
    if(!Object.keys(rep.sections).length)line("Runtime","A quiet night. Nothing in the Runtime simulates yet.");
    S.reports.push(rep);
    const summary=Object.values(rep.sections).flat().join(" ");
    log(`End Day at ${fmtTime(S.time)}. ${summary}`,"End Day");
    S.processedDates.push(date);
    S.date=next;S.time=C().dayStart;
    log(`Good morning. ${fmtDateLong(next)}.`,"System");
    commit("endday");
    UI.modal={type:"report",date};render();
  }finally{ending=false}
}

/* ================================================================
   SAVE: browser copy + private GitHub data repo (same split as Finn's tools)
   ================================================================ */
const LS={save:"tgc.save",gh:"tgc.gh",db:"tgc.db",dirty:"tgc.dirty",synced:"tgc.syncedAt",sha:"tgc.saveSha",tab:"tgc.tab"};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){console.warn(e);return false}}
let syncState="off",syncMsg="Not connected to GitHub",pushTimer=null;
function saveLocal(dirty){if(!S)return;lsSet(LS.save,S);if(dirty){lsSet(LS.dirty,true);if(GH.ready()){syncState="dirty";syncMsg="Unsynced changes";if(GH.mode()==="change"){clearTimeout(pushTimer);pushTimer=setTimeout(()=>GH.pushSave(),12000)}}}}
/** Call after any change to the state. */
function commit(reason){S.meta.savedAt=Date.now();saveLocal(true);if(reason==="endday"&&GH.ready()&&GH.mode()!=="manual")GH.pushSave()}
const b64enc=s=>{const b=new TextEncoder().encode(s);let bin="";for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const GH={
  cfg(){return lsGet(LS.gh,null)},
  ready(){const c=this.cfg();return !!(c&&c.owner&&c.repo&&c.token)},
  mode(){return (this.cfg()||{}).mode||"change"},
  url(path,withRef){const c=this.cfg();return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`+(withRef?`?ref=${encodeURIComponent(c.branch||"main")}`:"")},
  headers(){return {Authorization:"Bearer "+this.cfg().token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}},
  async get(path){
    const r=await fetch(this.url(path,true),{headers:this.headers(),cache:"no-store"});
    if(r.status===404)return null;
    if(!r.ok)throw new Error(`GitHub ${r.status} reading ${path}: ${(await r.text()).slice(0,140)}`);
    const j=await r.json();let text;
    if(j.content&&j.encoding==="base64")text=b64dec(j.content);
    else{const r2=await fetch(this.url(path,true),{headers:{...this.headers(),Accept:"application/vnd.github.raw+json"},cache:"no-store"});text=await r2.text()}
    return {data:JSON.parse(text),sha:j.sha};
  },
  async put(path,data,sha,message){
    const c=this.cfg();
    const body={message,content:b64enc(JSON.stringify(data,null,1)),branch:c.branch||"main"};if(sha)body.sha=sha;
    const r=await fetch(this.url(path,false),{method:"PUT",headers:{...this.headers(),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok){const e=new Error(`GitHub ${r.status} saving ${path}`);e.status=r.status;throw e}
    return (await r.json()).content.sha;
  },
  async loadDBs(){const cd=await this.get("cards.json");if(cd){setCards(cd.data);lsSet(LS.db,{cards:cd.data})}return {cards:!!cd}},
  async pullSave(force){
    const rem=await this.get("save.json");
    if(!rem){lsSet(LS.sha,null);return "none"}
    lsSet(LS.sha,rem.sha);
    const remoteAt=rem.data.meta?.savedAt||0,localAt=S?.meta?.savedAt||0,dirty=lsGet(LS.dirty,false);
    if(force||!S||(!dirty&&remoteAt>=localAt)){S=migrate(rem.data);saveLocal(false);lsSet(LS.dirty,false);lsSet(LS.synced,remoteAt);return "loaded"}
    if(dirty&&remoteAt>(lsGet(LS.synced,0))){
      if(confirm("GitHub has a newer save than the last one this browser synced, and this browser also has unsynced changes.\n\nOK = load GitHub's save (this browser's changes are dropped)\nCancel = keep this browser's save (it will overwrite GitHub on next sync)")){S=migrate(rem.data);saveLocal(false);lsSet(LS.dirty,false);lsSet(LS.synced,remoteAt);return "loaded"}
    }
    return "kept";
  },
  async pushSave(){
    if(!this.ready()||!S)return;
    clearTimeout(pushTimer);
    if(this.busy){this.again=true;return}
    this.busy=true;
    try{await this._push()}finally{this.busy=false}
    if(this.again){this.again=false;return this.pushSave()}
  },
  async _push(){
    syncState="busy";syncMsg="Saving to GitHub…";renderStatus();
    const msg=`${S.date} ${fmtTime(S.time)}`;
    try{
      let sha=lsGet(LS.sha,null);
      try{sha=await this.put("save.json",S,sha,msg)}
      catch(e){
        if(e.status===409||e.status===422){
          const rem=await this.get("save.json");const remoteAt=rem?.data?.meta?.savedAt||0;
          if(rem&&remoteAt>lsGet(LS.synced,0)&&!confirm("GitHub's save changed since this browser last synced (another device?). Overwrite it with this browser's save?"))throw new Error("Sync paused — resolve in Settings");
          sha=await this.put("save.json",S,rem?.sha,msg);
        }else throw e;
      }
      lsSet(LS.sha,sha);lsSet(LS.dirty,false);lsSet(LS.synced,S.meta.savedAt);
      syncState="ok";syncMsg="Saved to GitHub "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    }catch(e){syncState="err";syncMsg=e.message;console.error(e)}
    renderStatus();
  },
};

VIEWS.contracts=()=>`<div class="panel"><h2>Contracts</h2>${S.contracts.length?"":`<div class="empty">No contracts yet. Deals made in scenes get entered here.</div>`}</div>${soon(11,"Contract ledger with schedules and offsets, incoming offer cards, Add investor, Fellowships.")}`;

VIEWS.devlog=()=>`<div class="panel"><h2>Dev Log</h2><div class="small muted">What Emerson chooses to tell members. The Journal records what happened; the Dev Log is her voice.</div>${S.devLog.length?"":`<div class="empty" style="margin-top:6px">No posts yet.</div>`}</div>${soon(11,"Writing area, release-preview tag, dated archive, and the 1-hr Post a Dev Log action with its small hype bump.")}`;

VIEWS.ledger=()=>{
  const months=[...new Set(S.journal.map(j=>monthKey(j.d)))].sort().reverse();

  const days=[...new Set(S.journal.map(j=>j.d))].sort().reverse();

  <div class="panel"><h2>Emerson's wallet</h2><div class="mono gold" style="font-size:1.4rem">${fmtCr(S.money.wallet)}</div><div class="small muted">Her own money. Her salary lands here at month close.</div></div>
  </div>
  <div class="panel"><div class="hd"><h2>Export a day</h2></div>
    <div class="two"><select id="exDay">${days.map(d=>`<option value="${d}" ${d===ed?"selected":""}>${esc(fmtDate(d))}</option>`).join("")}</select><div class="btns" style="margin:0"><button class="btn" data-act="exDayCopy">Copy</button><button class="btn" data-act="exDayDl">Download .md</button></div></div></div>

    <div class="jr">${rows||`<div class="empty">Nothing yet.</div>`}</div></div>`};

VIEWS.settings=()=>{const g=GH.cfg()||{};return `
  <div class="panel"><div class="hd"><h2>GitHub save</h2><span class="small" id="syncMsg">${esc(syncMsg)}</span></div>
    <div class="small muted">The page is public; your save and card catalog live in a private repo (<span class="mono">the-guild-console-data</span>). The token stays in this browser only.</div>
    <div class="two"><div><label class="f">Owner</label><input id="ghOwner" value="${esc(g.owner||"8BitBoar")}" autocapitalize="off" autocomplete="off"></div><div><label class="f">Repo</label><input id="ghRepo" value="${esc(g.repo||"the-guild-console-data")}" autocapitalize="off" autocomplete="off"></div></div>
    <div class="two"><div><label class="f">Branch</label><input id="ghBranch" value="${esc(g.branch||"main")}" autocapitalize="off"></div><div><label class="f">Save to GitHub</label><select id="ghMode"><option value="change" ${(g.mode||"change")==="change"?"selected":""}>After changes</option><option value="endday" ${g.mode==="endday"?"selected":""}>After End Day</option><option value="manual" ${g.mode==="manual"?"selected":""}>Manual only</option></select></div></div>
    <label class="f">Fine-grained token (Contents: Read and write)</label><input id="ghToken" type="password" value="${esc(g.token||"")}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="btns"><button class="btn gold" data-act="ghConnect">Save &amp; connect</button><button class="btn" data-act="ghPush" ${GH.ready()?"":"disabled"}>Save to GitHub now</button><button class="btn" data-act="ghPull" ${GH.ready()?"":"disabled"}>Load from GitHub</button><button class="btn" data-act="ghReloadCards" ${GH.ready()?"":"disabled"}>Reload cards.json</button><button class="btn danger" data-act="ghForget" ${g.token?"":"disabled"}>Forget token</button></div></div>

    <div class="btns"><button class="btn" data-act="export">Export save</button><button class="btn" data-act="import">Import save</button></div></div>
  ${S?`<div class="panel"><h2>Story controls</h2><div class="small muted">Scenes move the clock by hand. Personal life isn't simulated.</div>
    <div class="btns"><button class="btn" data-act="scene">Scene: __ hrs</button></div></div>
  <div class="panel"><h2>This save</h2><dl class="kv"><dt>Founding date</dt><dd>${esc(fmtDate(S.startDate))}</dd><dt>Days processed</dt><dd>${S.processedDates.length}</dd><dt>Seed</dt><dd>${esc(S.seed)}</dd><dt>Build</dt><dd>${BUILD.version} · milestone ${BUILD.milestone}</dd></dl>

    <li>Set in a Marvel-adjacent continuity (Krakoa, the Phoenix, Emma Frost and others belong to Marvel). Unofficial fan content.</li>
    <li>Dev Tool cards reference <i>Yu-Gi-Oh!</i> (Konami) and <i>Magic: The Gathering</i> (Wizards of the Coast) cards by name and rules only. Unofficial fan content.</li>
    <li>Medu Netjer is the Egyptian name for hieroglyphic writing; the Guild's glyph motifs are drawn by hand in code.</li>
    <li>Emerson's winged sun-disk seal and the starfield are drawn in code. No generated images.</li>

/* ---------------- Markdown: Snapshot and Export a day ---------------- */
function snapshotMD(){
  const e=S.emerson,m=S.money,L=[];
  L.push(`# The Guild — Snapshot`,`${fmtDateLong(S.date)}, ${fmtTime(S.time)} · ${STAGES[S.stage]} · ${PHASES[S.phase]}`,"");
  L.push(`## Emerson`,`- Concept Level ${e.level} (${fmtN(e.xp)} / ${fmtN(xpToNext(e.level))} XP)${e.unspentPoints?` · ${e.unspentPoints} unspent stat point(s)`:""}`,`- Authority ${e.stats.authority} · Thought ${e.stats.thought} · Flesh ${e.stats.flesh}`,"");
  L.push(`## Runtime`,`- Capacity: ${usedCapacity()} active / ${safeCapacity()} safe / ${S.runtime.maxCapacity} max · efficiency ${pct(efficiency())}`,`- Kernel Panic ${S.runtime.kernelPanicCharged?"charged":"spent"} · Antivirus ${S.runtime.antivirus?"live":"not built"} · PEST CONTROL rank ${S.runtime.pestRank}`,`- Incursions: ${S.incursions.length?S.incursions.length:"none"}`,"");
  L.push(`## Projects`);if(!S.projects.length)L.push("- None deployed yet");L.push("");
  L.push(`## Foundation track`);for(const c of coreCards()){const st=isLive(c.id)?"live":S.foundation.unlocked.includes(c.id)?"unlocked":"locked";L.push(`- ${c.step==="special"?"Special":"Step "+c.step}: ${c.name} — ${st}`)}L.push("");
  const held=Object.keys(S.cards).filter(k=>S.cards[k]>0);
  L.push(`## Cards and shards`,`- In hand: ${held.length?held.map(k=>cardName(k)+(S.cards[k]>1?` ×${S.cards[k]}`:"")).join(", "):"none"}`,`- Unopened packs: ${S.packs.length}`,`- Glyph shards: ${S.shards}`,`- Codex entries: ${Object.keys(S.codex).length}`,"");
  L.push(`## Subscribers`,`- Active ${activeCount()} · Trial ${trialCount()} · Lapsed ${sumTiers(S.subs.lapsed)} · Waitlist ${S.subs.waitlist}`,`- Tier mix: ${TIERS.map(t=>`${t} ${S.subs.active[t]}`).join(", ")}`,"");
  L.push(`## Money`,`- Guild treasury: ${fmtCr(m.treasury)} · Emerson's wallet: ${fmtCr(m.wallet)}`,`- This month: revenue ${fmtCr(m.monthRevenue)}, expenses ${fmtCr(m.monthExpense)}`,`- Reserve ${fmtCr(m.reserve)} · Expansion fund ${fmtCr(m.expansionFund)} · Fellowship fund ${fmtCr(m.fellowshipFund)}`,...S.investors.map(i=>`- Investor: ${i.name}, ${i.units} units, paid ${fmtCr(i.paid)} of ${fmtCr(i.cap)}`),"");
  L.push(`## Planes`,...S.planes.map(p=>`- ${p.name}: Standing Lv ${p.level}, demand ${p.demand}, Registry ${p.registryActive?"active":"not active"}, ${p.waystones.length} Waystone(s)${p.innDoor?", Inn door":""}`),"");
  L.push(`## Contracts`,S.contracts.length?S.contracts.map(c=>`- ${c.party}: ${c.type}`).join("\n"):"- None","");
  L.push(`## Housing`,S.housing.neighborhoods.length?`- ${S.housing.neighborhoods.length} neighborhood(s)`:"- Housing Plane not built","");
  L.push(`## Recent journal`);for(const j of S.journal.slice(-12))L.push(`- ${j.d} ${fmtTime(j.t)} [${j.cat}] ${j.text}`);
  return L.join("\n");
}
const EXPORT_SECTIONS=["Development","Security","Cards","Guild","Subscribers","Planes and Contracts","Money","Dev Logs"];
function exportDayMD(date){
  const ents=S.journal.filter(j=>j.d===date),L=[`# ${fmtDateLong(date)} — The Guild`,""];
  const rep=S.reports.find(r=>r.date===date);
  for(const sec of EXPORT_SECTIONS){const items=ents.filter(j=>j.cat===sec);const rl=rep?.sections?.[sec]||[];L.push(`## ${sec}`);if(!items.length&&!rl.length)L.push("- Nothing");for(const j of items)L.push(`- ${fmtTime(j.t)}: ${j.text}`);for(const t of rl)L.push(`- Overnight: ${t}`);L.push("")}
  L.push(`## Journal`);for(const j of ents)L.push(`- ${fmtTime(j.t)} [${j.cat}] ${j.text}`);
  return L.join("\n");
}

/* ---------------- modals ---------------- */
function modalHTML(){
  const m=UI.modal;if(!m)return "";
  if(m.type==="report"){const r=S.reports.find(x=>x.date===m.date);const secs=r?Object.entries(r.sections):[];
    return `<div class="mback" data-act="closeModal"><div class="mbox" role="dialog" aria-label="End Day report"><div class="hd"><h2>Overnight · ${esc(fmtDate(m.date))}</h2><button class="btn small" data-act="closeModal">Morning</button></div>
    ${secs.map(([k,v])=>`<h3 style="margin-top:6px">${esc(k)}</h3><ul class="plain">${v.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`).join("")}
    <p class="small muted" style="margin-top:12px">Ended at ${fmtTime(r?.endedAt||0)}. It's now 7:00 AM, ${esc(fmtDate(S.date))}.</p></div></div>`}
  if(m.type==="bell"){const ns=[...S.notifications].reverse();
    return `<div class="mback" data-act="closeModal"><div class="mbox" role="dialog" aria-label="Notifications"><div class="hd"><h2>Notifications</h2><div class="btns" style="margin:0"><button class="btn small" data-act="readAll">Mark all read</button><button class="btn small" data-act="closeModal">Close</button></div></div>
    ${ns.length?ns.map(n=>`<div class="note ${n.read?"read":""}"><b>${esc(n.title)}</b><div class="small muted">${esc(fmtDate(n.date))}</div><div class="small" style="margin-top:3px">${esc(n.body)}</div></div>`).join(""):`<div class="empty">Nothing new.</div>`}</div></div>`}
  if(m.type==="scene")return `<div class="mback" data-act="closeModal"><div class="mbox" role="dialog" aria-label="Scene"><div class="hd"><h2>Scene</h2><button class="btn small" data-act="closeModal">Cancel</button></div>
    <div class="small muted">Meals, training, family, flights, Jeff. Moves the clock with no late penalty.</div>
    <label class="f">Hours</label><input id="sceneHrs" type="number" inputmode="decimal" min="0.25" step="0.25" value="1">
    <label class="f">Note (optional)</label><input id="sceneNote" placeholder="Breakfast with Mom and Sekhmet">
    <div class="btns"><button class="btn gold" data-act="sceneGo">Advance clock</button></div></div></div>`;
  return "";
}

/* ---------------- first run ---------------- */
function firstRunHTML(){
  return `<div class="first panel">${SEAL.replace("<svg","<svg class=\"seal\"")}
    <div class="hello">Hello, World.</div>
    <h2 style="margin:8px 0 4px">The Guild Console</h2>
    <p class="muted small">Emerson's developer side of the Akh Runtime. Pick the date the founding scene sets, or connect to GitHub to load an existing save.</p>
    <label class="f" style="text-align:left">Founding date</label><input id="startDate" type="date" value="2026-08-11">
    <div class="btns" style="justify-content:center"><button class="btn gold" data-act="begin">Begin</button><button class="btn" data-act="goSettings">Connect to GitHub</button><button class="btn" data-act="import">Import save</button></div></div>`;
}

/* ---------------- render ---------------- */
function render(){
  $("#top").innerHTML=topHTML();
  if(!S&&UI.tab!=="settings"&&UI.tab!=="credits"){$("#view").innerHTML=firstRunHTML()}
  else{const fn=VIEWS[UI.tab]||VIEWS.projects;$("#view").innerHTML=fn()}
  $("#modal").innerHTML=modalHTML();
  document.body.classList.toggle("noscroll",!!UI.modal);
  renderStatus();
  const on=$("#tabs button.on");if(on)on.scrollIntoView({block:"nearest",inline:"nearest"});
}
function go(tab){UI.tab=tab;if(TABS.some(t=>t[0]===tab))lsSet(LS.tab,tab);render();window.scrollTo({top:0})}

/* ---------------- events ---------------- */
document.addEventListener("click",async ev=>{
  const tabB=ev.target.closest("[data-tab]");if(tabB){go(tabB.dataset.tab);return}
  if(ev.target.closest("#endDay")){endDay();return}
  if(ev.target.closest("#snapBtn")){go("snapshot");return}
  if(ev.target.closest("#bellBtn")){UI.modal={type:"bell"};render();return}
  if(ev.target.closest("#syncDot")){go("settings");return}
  if(ev.target.closest("#creditsLink")){go("credits");return}
  const a=ev.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="closeModal"){if(a.classList.contains("mback")&&ev.target!==a)return;
    if(UI.modal?.type==="bell"){S.notifications.forEach(n=>n.read=true);commit()}
    UI.modal=null;render();return}
  switch(act){
    case "readAll":S.notifications.forEach(n=>n.read=true);commit();render();break;
    case "begin":{const d=$("#startDate").value;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast("Pick a date");return}newGame(d);go("projects");if(GH.ready()&&GH.mode()!=="manual")GH.pushSave();break}
    case "goSettings":go("settings");break;
    case "back":go(lsGet(LS.tab,"projects"));break;
    case "snapCopy":copyText(snapshotMD());break;
    case "snapDl":download(`guild-snapshot-${S.date}.md`,snapshotMD(),"text/markdown");break;
    case "exDayCopy":copyText(exportDayMD($("#exDay").value));break;
    case "exDayDl":{const d=$("#exDay").value;download(`guild-day-${d}.md`,exportDayMD(d),"text/markdown");break}
    case "scene":UI.modal={type:"scene"};render();setTimeout(()=>$("#sceneHrs")?.focus(),30);break;
    case "sceneGo":{const h=parseFloat($("#sceneHrs").value);if(!(h>0)||h>24){toast("Enter hours between 0 and 24");return}scene(h,$("#sceneNote").value.trim());commit();UI.modal=null;render();toast(`Clock: ${fmtTime(S.time)}`);break}
    case "export":if(!S){toast("No save yet");return}download(`guild-save-${S.date}.json`,JSON.stringify(S,null,1));break;
    case "import":$("#importFile").click();break;
    case "newGame":{if(!confirm("Start a new save? This browser's save is replaced (export a backup first). If GitHub is connected, the next sync overwrites save.json there too."))return;const d=prompt("Founding date (YYYY-MM-DD)",S.startDate);if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return;newGame(d);go("projects");break}
    case "ghConnect":await ghConnect();break;
    case "ghPush":await GH.pushSave();render();break;
    case "ghPull":{if(!confirm("Load save.json from GitHub, replacing this browser's save?"))return;syncState="busy";syncMsg="Loading…";renderStatus();try{const r=await GH.pullSave(true);syncState="ok";syncMsg=r==="none"?"No save.json on GitHub yet":"Loaded from GitHub";}catch(e){syncState="err";syncMsg=e.message}render();break}
    case "ghReloadCards":try{const g=await GH.loadDBs();toast(g.cards?`Loaded ${CAT.cards.length} cards`:"No cards.json in the repo — using the built-in copy")}catch(e){toast(e.message)}render();break;
    case "ghForget":{const c=GH.cfg()||{};delete c.token;lsSet(LS.gh,c);syncState="off";syncMsg="Not connected to GitHub";render();break}
  }
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="jMonth"){UI.jMonth=ev.target.value;render()}
  if(ev.target.id==="exDay"){UI.exportDay=ev.target.value}
});
$("#importFile").addEventListener("change",async ev=>{
  const f=ev.target.files[0];ev.target.value="";if(!f)return;
  try{const data=JSON.parse(await f.text());
    if(!data||data.meta?.app!=="the-guild-console"||!data.emerson||!data.date)throw new Error("That file isn't a Guild Console save.");
    if(S&&!confirm(`Replace this browser's save (${fmtDate(S.date)}) with the file's (${fmtDate(data.date)})?`))return;
    S=migrate(data);commit("import");toast("Save imported");go("projects");
  }catch(e){toast(e.message,4000)}
});
async function ghConnect(){
  const c={owner:$("#ghOwner").value.trim(),repo:$("#ghRepo").value.trim(),branch:$("#ghBranch").value.trim()||"main",token:$("#ghToken").value.trim(),mode:$("#ghMode").value};
  lsSet(LS.gh,c);
  if(!GH.ready()){toast("Fill in owner, repo and token.");return}
  syncState="busy";syncMsg="Connecting…";render();
  try{
    const got=await GH.loadDBs();
    const r=await GH.pullSave(false);
    if(r==="none"){if(S)await GH.pushSave();else{syncState="ok";syncMsg="Connected — no save on GitHub yet"}}
    else{syncState=lsGet(LS.dirty,false)?"dirty":"ok";syncMsg=r==="loaded"?"Loaded save from GitHub":"Connected — this browser's save kept"}
    toast(`Connected. ${CAT.cards.length} cards${got.cards?"":" (no cards.json in the repo — using the built-in copy)"}.`,3500);
  }catch(err){syncState="err";syncMsg=err.message}
  render();
}

/* ---------------- starfield (drawn in code) ---------------- */
function drawSky(){
  const cv=$("#sky"),dpr=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);
  const bg=g.createRadialGradient(w*.7,h*.15,0,w*.7,h*.15,Math.max(w,h));bg.addColorStop(0,"#121a3f");bg.addColorStop(.55,"#0a1029");bg.addColorStop(1,"#05081a");g.fillStyle=bg;g.fillRect(0,0,w,h);
  const r=mulberry32(1081026);const n=Math.round(w*h/2600);
  for(let i=0;i<n;i++){const x=r()*w,y=r()*h,s=r()<.06?1.4:r()*.9+.2,a=.25+r()*.6;g.fillStyle=r()<.12?`rgba(241,212,140,${a})`:`rgba(220,226,255,${a})`;g.beginPath();g.arc(x,y,s,0,7);g.fill()}
  // a few faint golden constellations
  g.strokeStyle="rgba(217,178,90,.13)";g.lineWidth=1;
  for(let k=0;k<4;k++){let x=r()*w,y=r()*h;g.beginPath();g.moveTo(x,y);const pts=[[x,y]];for(let j=0;j<5;j++){x+=(r()-.5)*160;y+=(r()-.5)*120;g.lineTo(x,y);pts.push([x,y])}g.stroke();g.fillStyle="rgba(241,212,140,.5)";for(const [px,py] of pts){g.beginPath();g.arc(px,py,1.6,0,7);g.fill()}}
}
let skyT;addEventListener("resize",()=>{clearTimeout(skyT);skyT=setTimeout(drawSky,150)});

/* ================================================================
   BOOT
   ================================================================ */
(async function boot(){
  drawSky();
  const db=lsGet(LS.db,null);setCards(db&&db.cards?db.cards:DEFAULT_CARDS);
  const local=lsGet(LS.save,null);
  if(local)S=migrate(local);
  render();
  if(GH.ready()){
    syncState="busy";syncMsg="Syncing…";renderStatus();
    try{await GH.loadDBs();const r=await GH.pullSave(false);if(r==="none"&&S)await GH.pushSave();
      else{syncState=lsGet(LS.dirty,false)?"dirty":"ok";syncMsg=lsGet(LS.dirty,false)?"Unsynced changes":"In sync with GitHub"}}
    catch(e){syncState="err";syncMsg=e.message}
    render();
  }
  addEventListener("beforeunload",()=>{if(GH.ready()&&lsGet(LS.dirty,false)&&GH.mode()!=="manual")GH.pushSave()});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&GH.ready()&&lsGet(LS.dirty,false)&&GH.mode()==="change")GH.pushSave()});
})();
</script>
