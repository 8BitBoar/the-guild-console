    <div class="small">${PACKS.map(p=>`${PACKNAME[p]}: <span class="mono gold">${pityLeft(p)}</span>`).join(" · ")} <span class="muted">packs to a guaranteed Rare</span></div></div>
  <div class="panel"><div class="hd"><h2>Foundation track</h2><span class="small muted">Core cards are granted, never drawn</span></div>
    <div class="track">${core.map(c=>{const live=isLive(c.id),dep=isDeployed(c.id),on=un.includes(c.id),bp=S.projects.find(p=>p.cardId===c.id&&(p.status==="coding"||p.status==="testing"));const conds=(FOUNDATION[c.id]||(()=>[]))();

      return `<div class="step ${st[0]}"><div class="k">${c.step==="special"?"✦":c.step}</div><div><div>${esc(c.name)} <span class="small r-${c.rarity}">${RAR[c.rarity]}</span></div><div class="s">${on?"Turns on: "+esc(c.effect?.turnsOn||""):conds.map(([l,m])=>`<span class="${m?"good":""}">${m?"✓":"○"} ${esc(l)}</span>`).join(" · ")}</div></div><div style="text-align:right"><span class="pill ${live?"live":on?"on":""}">${st[1]}</span>${!on?`<div><button class="linkbtn" data-act="grantEarly" data-id="${c.id}">grant early</button></div>`:""}</div></div>`}).join("")}</div>

VIEWS.codex=()=>{const ids=Object.keys(S.codex).filter(getCard);
  ids.sort((a,b)=>(S.codex[b].expertiseHours-S.codex[a].expertiseHours)||getCard(a).name.localeCompare(getCard(b).name));
  const th=S.settings.expertise.thresholds;
  return `<div class="panel"><div class="hd"><h2>Codex</h2><span class="pill">${ids.length} discovered</span></div>
  <div class="small muted" style="margin-bottom:8px">Every card she has drawn or been granted. Expertise is permanent: 1 per hour coding or repairing that card; ranks at ${th.join(" / ")} hrs cut coding time by ${S.settings.expertise.cuts.map(x=>x*100+"%").join(" / ")}.</div>
  ${ids.length?`<div class="codex">${ids.map(id=>{const c=getCard(id),x=S.codex[id],h=x.expertiseHours||0,rk=expertiseRank(h),next=th[rk],prev=rk?th[rk-1]:0;
    return `<div class="crow" data-card="${esc(id)}" role="button" tabindex="0"><div><div><span class="r-${c.rarity}">●</span> ${esc(c.name)}</div><div class="small muted">${PACKNAME[c.pack]} · ${EXP_TITLES[rk]}${rk?` · −${S.settings.expertise.cuts[rk-1]*100}%`:""} · in hand ${S.cards[id]||0}</div></div><div style="min-width:110px"><div class="bar teal"><i style="width:${next?clamp((h-prev)/(next-prev)*100,0,100):100}%"></i></div><div class="small mono muted" style="text-align:right">${+h.toFixed(1)}${next?" / "+next:""} hrs</div></div></div>`}).join("")}</div>`:`<div class="empty">Nothing yet.</div>`}</div>`};

VIEWS.ledger=()=>{

  const entries=S.journal.filter(j=>monthKey(j.d)===mk);
  let lastD=null,rows="";
  for(let i=entries.length-1;i>=0;i--){const j=entries[i];if(j.d!==lastD){rows+=`<div class="jday">${esc(fmtDate(j.d))}</div>`;lastD=j.d}rows+=`<div class="tm">${fmtTime(j.t).replace(/ \(\+\d+d\)/,"+")}</div><div class="tx"><span class="c">${esc(j.cat)}</span>${esc(j.text)}</div>`}

  <div class="panel"><h2>Guild treasury</h2><div class="mono gold" style="font-size:1.4rem">${fmtCr(S.money.treasury)}</div><div class="small muted">The cooperative's money.</div></div>

/* ---------------- Markdown: Snapshot and Export a day ---------------- */
function snapshotMD(){
  const e=S.emerson,m=S.money,L=[];
  L.push(`# The Guild — Snapshot`,`${fmtDateLong(S.date)}, ${fmtTime(S.time)} · ${STAGES[S.stage]} · ${PHASES[S.phase]}`,"");
  L.push(`## Emerson`,`- Concept Level ${e.level} (${fmtN(e.xp)} / ${fmtN(xpToNext(e.level))} XP)${e.unspentPoints?` · ${e.unspentPoints} unspent stat point(s)`:""}`,`- Authority ${e.stats.authority} · Thought ${e.stats.thought} · Flesh ${e.stats.flesh}`,`- Efficiency ${pct(efficiency())} · Purge ${pct(purgePct())} · Patch +${patchAmt()} · latent Bugs −${pct(latentBugCut())}`,"");
  L.push(`## Runtime`,`- Capacity: ${usedCapacity()} active / ${safeCapacity()} safe / ${S.runtime.maxCapacity} max · efficiency ${pct(efficiency())}`,`- Kernel Panic ${S.runtime.kernelPanicCharged?"charged":"spent"} · Antivirus ${S.runtime.antivirus?"live":"not built"} · PEST CONTROL rank ${S.runtime.pestRank}`,`- Incursions: ${S.incursions.length?S.incursions.length:"none"}`,"");
  L.push(`## Projects`);if(!S.projects.length)L.push("- None deployed yet");L.push("");
  L.push(`## Foundation track`);for(const c of coreCards()){const st=isLive(c.id)?"live":S.foundation.unlocked.includes(c.id)?"unlocked":"locked";L.push(`- ${c.step==="special"?"Special":"Step "+c.step}: ${c.name} — ${st}`)}L.push("");
  const held=Object.keys(S.cards).filter(k=>S.cards[k]>0);
  L.push(`## Cards and shards`,`- In hand: ${held.length?held.map(k=>cardName(k)+(S.cards[k]>1?` ×${S.cards[k]}`:"")).join(", "):"none"}`,`- Unopened packs: ${S.packs.length}`,`- Glyph shards: ${S.shards}`,`- Codex entries: ${Object.keys(S.codex).length}`,"");
  L.push(`## Subscribers`,`- Active ${activeCount()} · Trial ${trialCount()} · Lapsed ${sumTiers(S.subs.lapsed)} · Waitlist ${S.subs.waitlist}`,`- Tier mix: ${TIERS.map(t=>`${t} ${tierTotal(t)}`).join(", ")}`,`- Hype: ${hypeNow().name||"none"} · drought ${droughtNow().days} days (churn ×${droughtNow().mult.toFixed(1)})`,"");
  L.push(`## Money`,`- Guild treasury: ${fmtCr(m.treasury)} · Emerson's wallet: ${fmtCr(m.wallet)}`,`- This month: revenue ${fmtCr(m.monthRevenue)}, expenses ${fmtCr(m.monthExpense)}`,`- Reserve ${fmtCr(m.reserve)} · Expansion fund ${fmtCr(m.expansionFund)} · Fellowship fund ${fmtCr(m.fellowshipFund)}`,...S.investors.map(i=>`- Investor: ${i.name}, ${i.units} units, paid ${fmtCr(i.paid)} of ${fmtCr(i.cap)}`),"");
  L.push(`## Planes`,...S.planes.map(p=>`- ${p.name}: Standing Lv ${p.level}, demand ${p.demand}, Registry ${p.registryActive?"active":"not active"}, ${p.waystones.length} Waystone(s)${p.innDoor?", Inn door":""}`),"");
  L.push(`## Contracts`,S.contracts.length?S.contracts.map(c=>`- ${c.party}: ${c.type}`).join("\n"):"- None","");
  L.push(`## Housing`,S.housing.neighborhoods.length?`- ${S.housing.neighborhoods.length} neighborhood(s)`:"- Housing Plane not built","");
  L.push(`## Recent journal`);for(const j of S.journal.slice(-12))L.push(`- ${j.d} ${fmtTime(j.t)} [${j.cat}] ${j.text}`);
  return L.join("\n");
}
const EXPORT_SECTIONS=["Development","Security","Cards","Guild","Subscribers","Planes and Contracts","Money","Dev Logs"];
function exportDayMD(date){
  const ents=S.journal.filter(j=>j.d===date),L=[`# ${fmtDateLong(date)} — The Guild`,""];
  const rep=S.reports.find(r=>r.date===date);
  for(const sec of EXPORT_SECTIONS){const items=ents.filter(j=>j.cat===sec);const rl=rep?.sections?.[sec]||[];L.push(`## ${sec}`);if(!items.length&&!rl.length)L.push("- Nothing");for(const j of items)L.push(`- ${fmtTime(j.t)}: ${j.text}`);for(const t of rl)L.push(`- Overnight: ${t}`);L.push("")}
  L.push(`## Journal`);for(const j of ents)L.push(`- ${fmtTime(j.t)} [${j.cat}] ${j.text}`);
  return L.join("\n");
}

/* ---------------- modals ---------------- */
function modalHTML(){
  const m=UI.modal;if(!m)return "";
  if(m.type==="report"){const r=S.reports.find(x=>x.date===m.date);const secs=r?Object.entries(r.sections):[];
    return `<div class="mback" data-act="closeModal"><div class="mbox" role="dialog" aria-label="End Day report"><div class="hd"><h2>Overnight · ${esc(fmtDate(m.date))}</h2><button class="btn small" data-act="closeModal">Morning</button></div>
    ${secs.map(([k,v])=>`<h3 style="margin-top:6px">${esc(k)}</h3><ul class="plain">${v.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`).join("")}
    <p class="small muted" style="margin-top:12px">Ended at ${fmtTime(r?.endedAt||0)}. It's now 7:00 AM, ${esc(fmtDate(S.date))}.</p></div></div>`}
  if(m.type==="bell"){const ns=[...S.notifications].reverse();

/* ---------------- render ---------------- */
function render(){
  if(UI.levelUp&&S&&(!UI.modal||UI.modal.type==="report")){if(!UI.modal){UI.modal={type:"levelup",n:UI.levelUp};UI.levelUp=0}}
  $("#top").innerHTML=topHTML();
  if(!S&&UI.tab!=="settings"&&UI.tab!=="credits"){$("#view").innerHTML=firstRunHTML()}
  else{const fn=VIEWS[UI.tab]||VIEWS.projects;$("#view").innerHTML=fn()}

}
function go(tab){UI.tab=tab;if(TABS.some(t=>t[0]===tab))lsSet(LS.tab,tab);render();window.scrollTo({top:0})}

  if(ev.target.id==="plCat"&&UI.modal?.type==="plane"){UI.modal.cat=ev.target.value||null;render();return}
  if(ev.target.id==="mkPack"){readMaker();UI.mk.pack=ev.target.value;UI.mk.needs=[];render();return}
  if(ev.target.id==="jMonth"){UI.jMonth=ev.target.value;render()}
  if(ev.target.id==="exDay"){UI.exportDay=ev.target.value}
});
$("#importFile").addEventListener("change",async ev=>{
  const f=ev.target.files[0];ev.target.value="";if(!f)return;
  try{const data=JSON.parse(await f.text());
    if(!data||data.meta?.app!=="the-guild-console"||!data.emerson||!data.date)throw new Error("That file isn't a Guild Console save.");
    if(S&&!confirm(`Replace this browser's save (${fmtDate(S.date)}) with the file's (${fmtDate(data.date)})?`))return;
    S=migrate(data);commit("import");toast("Save imported");go("projects");
  }catch(e){toast(e.message,4000)}
});
async function ghConnect(){
  const c={owner:$("#ghOwner").value.trim(),repo:$("#ghRepo").value.trim(),branch:$("#ghBranch").value.trim()||"main",token:$("#ghToken").value.trim(),mode:$("#ghMode").value};
  lsSet(LS.gh,c);
  if(!GH.ready()){toast("Fill in owner, repo and token.");return}
  syncState="busy";syncMsg="Connecting…";render();
  try{
    const got=await GH.loadDBs();
    const r=await GH.pullSave(false);
    if(r==="none"){if(S)await GH.pushSave();else{syncState="ok";syncMsg="Connected — no save on GitHub yet"}}
    else{syncState=lsGet(LS.dirty,false)?"dirty":"ok";syncMsg=r==="loaded"?"Loaded save from GitHub":"Connected — this browser's save kept"}
    toast(S?`Connected. ${CAT.cards.length} cards${got.cards?"":" (no cards.json in the repo — using the built-in copy)"}.`:`Connected. No save on GitHub yet — pick a founding date to begin.`,3500);
    if(!S||r==="loaded"){UI.tab="projects";lsSet(LS.tab,"projects")}
  }catch(err){syncState="err";syncMsg=err.message}
  render();
}

/* ---------------- starfield (drawn in code) ---------------- */
function drawSky(){
  const cv=$("#sky"),dpr=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);
  const bg=g.createRadialGradient(w*.7,h*.15,0,w*.7,h*.15,Math.max(w,h));bg.addColorStop(0,"#121a3f");bg.addColorStop(.55,"#0a1029");bg.addColorStop(1,"#05081a");g.fillStyle=bg;g.fillRect(0,0,w,h);
  const r=mulberry32(1081026);const n=Math.round(w*h/2600);
  for(let i=0;i<n;i++){const x=r()*w,y=r()*h,s=r()<.06?1.4:r()*.9+.2,a=.25+r()*.6;g.fillStyle=r()<.12?`rgba(241,212,140,${a})`:`rgba(220,226,255,${a})`;g.beginPath();g.arc(x,y,s,0,7);g.fill()}
  // a few faint golden constellations
  g.strokeStyle="rgba(217,178,90,.13)";g.lineWidth=1;
  for(let k=0;k<4;k++){let x=r()*w,y=r()*h;g.beginPath();g.moveTo(x,y);const pts=[[x,y]];for(let j=0;j<5;j++){x+=(r()-.5)*160;y+=(r()-.5)*120;g.lineTo(x,y);pts.push([x,y])}g.stroke();g.fillStyle="rgba(241,212,140,.5)";for(const [px,py] of pts){g.beginPath();g.arc(px,py,1.6,0,7);g.fill()}}
}
let skyT;addEventListener("resize",()=>{clearTimeout(skyT);skyT=setTimeout(drawSky,150)});

/* ================================================================
   BOOT
   ================================================================ */
(async function boot(){
  drawSky();
  const db=lsGet(LS.db,null);setCards(db&&db.cards?db.cards:DEFAULT_CARDS);setPlanes(db&&db.planes?db.planes:DEFAULT_PLANES);
  const local=lsGet(LS.save,null);
  if(local){S=migrate(local);recomputeRuntime();if(checkFoundation())saveLocal(true)}else UI.tab="projects";
  render();
  if(GH.ready()){
    syncState="busy";syncMsg="Syncing…";renderStatus();
    try{await GH.loadDBs();const r=await GH.pullSave(false);if(r==="none"&&S)await GH.pushSave();
      else{syncState=lsGet(LS.dirty,false)?"dirty":"ok";syncMsg=lsGet(LS.dirty,false)?"Unsynced changes":"In sync with GitHub"}}
    catch(e){syncState="err";syncMsg=e.message}
    render();
  }
  addEventListener("beforeunload",()=>{if(GH.ready()&&lsGet(LS.dirty,false)&&GH.mode()!=="manual")GH.pushSave()});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&GH.ready()&&lsGet(LS.dirty,false)&&GH.mode()==="change")GH.pushSave()});
})();
</script>
