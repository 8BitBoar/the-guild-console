/** Everything in a bundle: new projects, plus upgrades running on live projects. */
function bundleItems(b){const out=[];for(const p of S.projects){if(p.bundleId===b.id&&(p.status==="coding"||p.status==="testing"||p.status==="staged"))out.push({p,kind:"new",staged:p.status==="staged"});if(p.job&&p.job.bundleId===b.id)out.push({p,kind:"upgrade",staged:!!p.job.staged})}return out}
function bundleCheck(b){const it=bundleItems(b);const newClass=it.filter(x=>x.kind==="new"&&x.p.category==="Class").length,classUp=it.filter(x=>x.kind==="upgrade"&&x.p.category==="Class").length;
  const five=it.length>=5,cls=newClass>=1||classUp>=2,jr=!!b.journey,big=b.type!=="content";
  return {items:it.length,staged:it.filter(x=>x.staged).length,five,cls,jr,newClass,classUp,meetsExpansion:five&&cls&&jr,ready:it.length>0&&it.every(x=>x.staged),big}}
const setReleased=set=>S.bundles.some(b=>b.status==="launched"&&b.set===set&&b.launchedAs!=="content"&&b.type!=="content");
/** Can this card / project go in this bundle? Expansions take their own set's cards (Housing Features and the Journey from anywhere). */
function bundleFits(b,card){if(!b||b.type==="content")return null;const c=card||{};if(c.effect?.type==="neighborhood")return null;const s=cardSet(c);return s===b.set||s==="founding"?null:`${c.name} is from ${setName(s)}; ${b.name} takes ${setName(b.set)} and Founding Set cards.`}
function stageProject(p){if(p.status==="testing"&&phaseReady(p)&&p.bundleId){p.status="staged";log(`Staged ${p.name} for ${bundleById(p.bundleId)?.name}. The card stays reserved until launch.`,"Development");return true}
  if(p.job&&p.job.bundleId&&phaseReady(p.job)){p.job.staged=true;log(`Staged the V${p.job.target} upgrade of ${p.name} for ${bundleById(p.job.bundleId)?.name}. The live version keeps running.`,"Development");return true}return false}
/** Projects in a bundle that depend (directly or down the line) on p's card while it isn't deployed anywhere. */
function dependentsInBundle(p,bundleId){const out=[],seen=new Set([p.id]);const walk=q=>{for(const x of S.projects){if(seen.has(x.id)||x.bundleId!==bundleId||!(x.status==="coding"||x.status==="testing"||x.status==="staged"))continue;
    const needs=getCard(x.cardId)?.needs||[];if(needs.includes(q.cardId)&&!isDeployed(q.cardId)){seen.add(x.id);out.push(x);walk(x)}}};walk(p);return out}
/** Taking a staged parent out of its bundle pulls everything that depends on it out too; their reserved cards go back to her hand. */
function cascadeOut(p,bundleId){const deps=dependentsInBundle(p,bundleId);for(const d of deps){addCard(d.cardId);S.projects=S.projects.filter(x=>x!==d);log(`${d.name} came out with ${p.name}: its card went back to her hand (Expertise from ${fmtHrs(d.codeDone)} of coding is kept).`,"Development")}return deps}
/** Does p have a class parent that's only available because it's staged in p's bundle? Then p can't leave that bundle. */
function heldByStagedParent(p){const needs=getCard(p.cardId)?.needs||[];return needs.find(n=>isClassCard(getCard(n))&&!isDeployed(n)&&stagedIn(n,p.bundleId))||null}
const LAUNCH_ORDER={base:1,specialization:2,advanced:3,hybrid:4};
function unbundle(p,isJob){if(isJob&&p.job){p.job.bundleId=null;p.job.staged=false}else{p.bundleId=null;if(p.status==="staged")p.status="testing"}}
/** Launch (1 hr): every staged project deploys at once, the release's hype starts, and the Journey sales window opens. */
function launchBundle(b,asContent){
  const it=bundleItems(b);if(!it.length||!it.every(x=>x.staged))return false;
  const at=S.time;spend(S.settings.release.launchMin,null);
  const rank=x=>x.kind==="new"&&x.p.category==="Class"?(LAUNCH_ORDER[getCard(x.p.cardId)?.tier]||1):0;
  for(const x of [...it].sort((a,b)=>rank(a)-rank(b))){if(x.kind==="new"){x.p.status="testing";deploy(x.p,{noTime:true,quiet:true})}else{finishJob(x.p,{noTime:true})}}
  const type=asContent||b.type==="content"?"content":"expansion";
  S.releases.push({date:S.date,type,projectIds:it.map(x=>x.p.id),journey:!!b.journey,bundleId:b.id,set:b.set||null,rerun:b.type==="rerun",preview:(S.devLog||[]).some(l=>l.preview===b.id)});
  S.lastContentDate=S.date;b.status="launched";b.launched=S.date;b.launchedAs=type;
  for(const x of it){if(x.kind==="new")x.p.bundleId=b.id}
  log(`LAUNCH: ${b.name} — ${type==="content"?"Content update":BTYPE[b.type]}${b.set&&type!=="content"?` (${setName(b.set)})`:""}: ${it.length} project${it.length>1?"s":""}${b.journey?" and a Hero's Journey":""}.`,"Development",at);
  notify(`${b.name} is live`,`${type==="content"?"Content update":BTYPE[b.type]} hype has started${b.journey? " and the Hero's Journey's 30-day launch sales have started":""}.`);
  return true;
}

/** Cards whose effect is wired into the sim: rename, re-rarity, re-set and re-flavor them, but their mechanics stay put. */
const isLocked=c=>!!c&&(c.core||LOCKED_EFFECTS.has(c.effect?.type));
const setSym=id=>(setsList().find(s=>s.id===id)?.symbol)||SETSYM[id]||"◇";
const catDirty=()=>!!lsGet(LS.catDirty,false);
function catalogData(){return {version:2,notes:DEFAULT_CARDS.notes,sets:setsList().map(s=>({id:s.id,name:s.name,symbol:s.symbol||SETSYM[s.id]||"◇"})),cards:CAT.cards.map(c=>JSON.parse(JSON.stringify(c)))}}
function commitCatalog(data){const src=CAT.source;setCards(data);CAT.source=src==="built-in"?"edited":src;const db=lsGet(LS.db,{})||{};db.cards=data;lsSet(LS.db,db);lsSet(LS.catDirty,true)}
/** Older saves kept made-by-you cards in the save; they move into the catalog. */
function foldCustomCards(){if(!S||!S.customCards||!S.customCards.length)return false;const data=catalogData();
  for(const c of S.customCards){const o={...c};delete o.custom;delete o.created;const i=data.cards.findIndex(x=>x.id===o.id);if(i>=0)data.cards[i]=o;else data.cards.push(o)}
  S.customCards=[];commitCatalog(data);return true}
const slugId=(s,taken)=>{let b=s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"card",id=b,n=2;while(taken(id))id=b+"-"+n++;return id};
function cardRefs(id){return {held:S?.cards[id]||0,projects:S?S.projects.filter(p=>p.cardId===id).length:0,codex:!!S?.codex[id]}}
/** Delete: a card she has built or discovered is retired (kept so history still has a name); anything else is removed. Copies in hand go either way. */
function deleteCard(id){const data=catalogData(),i=data.cards.findIndex(c=>c.id===id);if(i<0)return null;const r=cardRefs(id);
  if(S&&r.held){delete S.cards[id]}
  let how;if(r.projects||r.codex){data.cards[i].retired=true;how="retired"}else{data.cards.splice(i,1);how="deleted"}
  commitCatalog(data);return how}
function restoreCard(id){const data=catalogData(),c=data.cards.find(x=>x.id===id);if(!c)return;delete c.retired;commitCatalog(data)}
function addSet(name,symbol){const data=catalogData();const id=slugId(name,x=>data.sets.some(s=>s.id===x));data.sets.push({id,name,symbol:symbol||"◇"});commitCatalog(data);return id}
function editSet(id,name,symbol){const data=catalogData(),s=data.sets.find(x=>x.id===id);if(!s)return;s.name=name||s.name;s.symbol=symbol||s.symbol;commitCatalog(data)}
function deleteSet(id,to){const data=catalogData();if(data.sets.length<2||id===to)return 0;let n=0;for(const c of data.cards)if((c.set||"founding")===id){c.set=to;n++}
  data.sets=data.sets.filter(s=>s.id!==id);commitCatalog(data);if(S)for(const b of S.bundles)if(b.set===id)b.set=to;return n}
function moveCards(ids,to){const data=catalogData();let n=0;for(const c of data.cards)if(ids.includes(c.id)&&!c.core){c.set=to;n++}commitCatalog(data);return n}

/** Departments: Adventurers per staffing unit, peak multiplier, when the department's teams switch on, and each team's workload multiplier / base floor. */

];
const teamId=(d,n)=>d.id+":"+n.toLowerCase().replace(/[^a-z0-9]+/g,"-");
/** Expected Inn food orders a month, for the kitchen-throughput floor. */
function foodOrdersMonth(){if(!isLive("guild-inn-and-tavern"))return 0;const al=allocation(),v=RV().inn;let f=0;for(const id in al){const {A,T,p}=al[id];if(p.innDoor)f+=(A+T)*v.food*(v.traffic[p.demand]||1)}return f*daysInMonth(S.date)}
/** Every team's minimum, peak, headcount and efficiency score right now. */
function staffing(){
  const act=activeCount(),phase2=S.phase!=="I",out=[];
  for(const d of DEPTS){const dOn=phase2&&d.on();
    for(const [n,mult,floor] of d.teams){const id=teamId(d,n);let min=dOn?Math.max(floor,Math.ceil(act/d.ratio*mult)):0;
      if(dOn&&n==="Food & Beverage")min=Math.max(min,Math.ceil(foodOrdersMonth()/2200));
      const peak=dOn?Math.ceil(min*d.peak):0;const staff=!dOn?0:S.staffing.autoStaff?min:(S.staffing.teams[id]??min);
      const score=!dOn?null:staff<min?.80+.20*staff/min:staff>=peak&&peak>min?1.10:1.00;
      out.push({dept:d,id,name:n,on:dOn,min,peak,staff,score})}}
  return out;
}
function staffingEfficiency(st=staffing()){const on=st.filter(t=>t.on);if(!on.length)return 1;const w=on.reduce((s,t)=>s+t.min,0)||1;return on.reduce((s,t)=>s+t.score*t.min,0)/w}
/** Monthly payroll: one head per active department, everyone else 57 / 32 / 11% general / skilled / specialist, plus 25% benefits. */
function payrollMonthly(st=staffing()){const ms=MS();let base=0,heads=0,staff=0;const avg=ms.mix.general*ms.pay.general+ms.mix.skilled*ms.pay.skilled+ms.mix.specialist*ms.pay.specialist;
  for(const d of DEPTS){const n=st.filter(t=>t.dept===d&&t.on).reduce((s,t)=>s+t.staff,0);if(!n)continue;heads++;staff+=n;base+=ms.pay.head+(n-1)*avg}
  return {staff,heads,total:base*(1+ms.benefits)}}
/** Share of earned revenue that comes from Earth-currency planes [default: by Registry activity weight; the home plane alone if no Registry is active]. */
function earthShare(){const ps=regPlanes();if(!ps.length)return S.planes.some(p=>p.earthCurrency)?1:0;const w=ps.reduce((s,p)=>s+(p.weight||0),0)||1;return ps.filter(p=>p.earthCurrency).reduce((s,p)=>s+(p.weight||0),0)/w}
/** End Day step 5. Adds daily costs to `exp`. */
function runDailyCosts(rev,exp,earned){
  const ms=MS(),days=daysInMonth(S.date),L=[];
  if(S.phase!=="I"){const pr=payrollMonthly();if(pr.total){exp.payroll=pr.total/days}}
  exp.salary=ms.salary/days;S.money.salaryAccrued=(S.money.salaryAccrued||0)+ms.salary/days;
  const act=activeCount();if(act)exp.overhead=act*ms.overheadPerActive/days;
  if(earned){exp.processing=earned*ms.processing;const es=earthShare();if(es)exp.exchange=earned*es*ms.exchange}
  // glyph shard trickle
  const sh=rollCount(act/ms.shardsPer,rng("shards"));if(sh){S.shards+=sh;L.push(`+${sh} glyph shard${sh>1?"s":""} from the Runtime.`)}
  return L;
}
/** Monthly fees for the new month, charged on the 1st. */
function monthlyFees(newMonth){const ms=MS(),f={};
  const d1=newMonth+"-01";
  const lic=regPlanes().filter(p=>(!p.activeSince||monthKey(p.activeSince)<newMonth)&&!feeWaived(p,"license",d1)).length;if(lic)f.licenses=lic*ms.license;
  const ws=S.planes.filter(p=>!feeWaived(p,"waystones",d1)).reduce((s,p)=>s+p.waystones.length,0);if(ws)f.waystoneFees=ws*ms.waystoneFee;
  if(S.phase==="I"||STAGE_ORDER.indexOf(S.stage)<2)f.counsel=ms.counsel;
  return f}
/** Month close: tax provision, emergency reserve, investor pool, then 40 / 40 / 20 to patronage, expansion and Fellowship. */
function monthClose(key){
  const ms=MS(),m=S.money,L=[],rec={key,revenue:m.monthRevenue,expense:m.monthExpense};
  const surplus=m.monthRevenue-m.monthExpense;rec.surplus=surplus;
  if(surplus>0){
    let left=surplus;const tax=left*ms.tax;left-=tax;rec.tax=tax;
    const target=ms.reserveMonths*m.monthExpense;const res=Math.max(0,Math.min(left*ms.reserveShare,target-m.reserve));left-=res;rec.reserve=res;
    const pool=left*ms.investorShare;left-=pool;let paid=0;
    let owed=S.investors.filter(i=>i.paid<i.cap);let rem=pool;
    for(let pass=0;pass<5&&rem>0.005&&owed.length;pass++){const units=owed.reduce((s,i)=>s+i.units,0)||1;let used=0;
      for(const i of owed){const pay=Math.min(rem*i.units/units,i.cap-i.paid);i.paid+=pay;used+=pay;i.lastPaid=(i.lastPaid||0)+pay}
      rem-=used;paid+=used;owed=owed.filter(i=>i.paid<i.cap-0.005)}
    for(const i of S.investors)if(i.paid>=i.cap-0.005&&!i.done){i.done=S.date;L.push(`${i.name}'s cap is reached; her units expire.`)}
    rec.investors=paid;left+=rem;rec.retained=rem;
    const pat=left*ms.residual.patronage,expn=left*ms.residual.expansion,fel=left*ms.residual.fellowship;
    const workers=S.phase==="I"?0:payrollMonthly().staff;
    rec.patronage=workers?pat:0;rec.patronageRetained=workers?0:pat;rec.expansion=expn;rec.fellowship=fel;
    const perWorker=workers?pat/(workers+1):0;rec.perWorker=perWorker;
    m.treasury-=tax+res+paid+(workers?pat:0)+expn+fel;m.reserve+=res;m.expansionFund+=expn;m.fellowshipFund+=fel;
    if(workers)m.wallet+=perWorker;
    if(paid)moneyTx("Investor payouts",paid,"Treasury","Investors");if(tax)moneyTx("Tax provision",tax,"Treasury","Tax");if(res)moneyTx("Emergency reserve",res,"Treasury","Reserve");
    if(workers)moneyTx(`Worker patronage (${workers} workers + Emerson)`,pat,"Treasury","Workers");moneyTx("Expansion fund",expn,"Treasury","Expansion fund");moneyTx("Fellowship fund",fel,"Treasury","Fellowship fund");
    L.push(`Surplus ${fmtCr(surplus)}: tax ${fmtCr(tax)}, reserve ${fmtCr(res)}, investors ${fmtCr(paid)}, ${workers?`patronage ${fmtCr(pat)} (${fmtCr(perWorker)} each, Emerson included)`:`patronage share ${fmtCr(pat)} kept in the treasury (Phase I has no workers yet)`}, expansion ${fmtCr(expn)}, Fellowship ${fmtCr(fel)}.`);
  }else L.push(surplus<0?`A deficit month (${fmtCr(surplus)}). Nothing is distributed; the treasury covers it.`:"No surplus to distribute.");
  const sal=m.salaryAccrued||0;if(sal){m.wallet+=sal;rec.salary=sal;moneyTx("Emerson's salary",sal,"Payroll","Emerson's wallet");L.push(`Emerson's salary: ${fmtCr(sal)} to her wallet.`)}m.salaryAccrued=0;
  for(const i of S.investors)i.lastPaid=0;
  m.closes=m.closes||[];m.closes.push(rec);if(m.closes.length>36)m.closes.shift();
  return L;
}

function moneyTx(what,amount,from,to){S.money.tx=S.money.tx||[];S.money.tx.push({date:S.date,what,amount:Math.round(amount*100)/100,from,to});if(S.money.tx.length>400)S.money.tx.shift()}
/** Move up to n members from Active (Adventurer first) to Lapsed. */
function lapseMembers(n){let left=n;for(const t of TIERS){const k=Math.min(left,S.subs.active[t]||0);S.subs.active[t]-=k;S.subs.lapsed[t]=(S.subs.lapsed[t]||0)+k;left-=k;if(!left)break}return n-left}
/** End Day: contract payouts, sponsored-membership starts and ends, Fellowship terms ending. */
function runContracts(rev){
  const L=[],r=rng("contracts"),d=S.date;
  for(const c of S.contracts){if(c.type==="surge")continue;
    if(c.type==="sponsored"){
      if(!c.started&&d>=c.start&&(!c.end||d<=c.end)){c.started=d;S.subs.active.Adventurer+=c.members;L.push(`${c.party}: ${fmtN(c.members)} sponsored members join as Active Adventurers.`)}
      if(c.started&&!c.ended&&c.end&&d>=c.end){c.ended=d;const keep=rollCount(c.members*.4,r);const gone=lapseMembers(c.members-keep);
        L.push(`${c.party}'s sponsorship ended: ${fmtN(keep)} keep subscribing on their own, ${fmtN(gone)} move to Lapsed.`);notify(`${c.party}: sponsorship ended`,`${fmtN(keep)} stayed, ${fmtN(gone)} lapsed with their progress saved.`)}
      continue}
    if(c.ended||!inRange(c,d))continue;
    let pay=0;
    if(c.schedule==="once"&&!c.paidOnce){pay=c.value;c.paidOnce=d}
    else if(c.schedule==="monthly"){const sd=+c.start.slice(8),dom=+d.slice(8);if(dom===Math.min(sd,daysInMonth(d)))pay=c.value}
    else if(c.schedule==="completion"&&c.planeId){const p=S.planes.find(x=>x.id===c.planeId);const n=p&&p.compDate===d?p.compToday:0;pay=n*c.value;if(n)c.units=(c.units||0)+n}
    if(pay){rev.contracts=(rev.contracts||0)+pay;c.paid=(c.paid||0)+pay;L.push(`${c.party} paid ${fmtCr(pay)} (${CTYPES[c.type]}${c.schedule==="completion"?`, ${p_n(c)}`:""}).`)}
    if(c.end&&d>=c.end&&!c.ended){c.ended=d;L.push(`${c.party}'s contract ended.`)}

}

function seatFellows(n){let left=n;const w=Math.min(left,S.subs.waitlist);S.subs.waitlist-=w;left-=w;
  for(const t of TIERS){if(!left)break;const k=Math.min(left,S.subs.lapsed[t]||0);S.subs.lapsed[t]-=k;left-=k}
  const seated=n-left;S.subs.active.Adventurer+=seated;return seated}

function runGuildFellowship(){

  const seated=addFellows("guild",n);S.money.fellowshipFund-=seated*cost;moneyTx(`Guild Fellowship: ${seated} three-month memberships`,seated*cost,"Fellowship fund","members' dues");

function runFellowTerms(){const L=[],r=rng("fellows");
  for(const f of S.fellows||[]){if(f.done||S.date<f.until)continue;f.done=S.date;let n=Math.min(f.count,S.subs.active.Adventurer);
    if(f.source==="guild"){const want=rollCount(n*.5,r),cost=fellowCost(),afford=Math.floor(S.money.fellowshipFund/cost),ren=Math.min(want,afford);
      if(ren){S.money.fellowshipFund-=ren*cost;S.fellows.push({id:newId("f"),source:"guild",count:ren,start:S.date,until:addMonths(S.date,3),renewal:true});moneyTx(`Guild Fellowship renewals: ${ren}`,ren*cost,"Fellowship fund","members' dues")}
      n-=ren;const stay=rollCount(n*.6,r),gone=lapseMembers(n-stay);
      L.push(`Guild Fellowship term ended for ${f.count}: ${ren} renewed, ${stay} now pay their own way, ${gone} lapsed.`)}
    else{const stay=rollCount(n*.6,r),gone=lapseMembers(n-stay);L.push(`Founder's Fellowship term ended for ${f.count}: ${stay} now pay their own way, ${gone} lapsed.`);

/** Revenue step: each Journey sells on its own: 10% / 2% over its 30-day launch, then 1% / 0.2% a month. Mythic and Ascendant claim free; some Mythic claimers pay 30 Cr to upgrade. */
function runJourneys(rev,act,trial,days,r){const J=RV().journeys,L=[];
  const all=S.releases.filter(x=>x.journey&&daysSince(x.date,S.date)>=0).sort((a,b)=>a.date<b.date?-1:1);if(!all.length)return L;
  const buyers=Math.max(0,act-tierTotal("Mythic")-tierTotal("Ascendant")+trial),newest=all[all.length-1];
  let tS=0,tP=0,tU=0,money=0;
  for(const x of all){const launch=daysSince(x.date,S.date)<J.days;
    const s=rollCount(buyers*(launch?J.std/J.days:J.tailStd/days),r),p=rollCount(buyers*(launch?J.prem/J.days:J.tailPrem/days),r);
    x.jStd=(x.jStd||0)+s;x.jPre=(x.jPre||0)+p;

    const m=s*J.stdPrice+p*J.premPrice+u*J.upgradePrice;x.jRev=(x.jRev||0)+m;money+=m;tS+=s;tP+=p;tU+=u}

/* ================================================================
   JOURNAL, NOTIFICATIONS, CLOCK
   ================================================================ */
const JCATS=["Development","Security","Cards","Guild","Subscribers","Planes and Contracts","Money","Dev Logs","Story","End Day","System"];
/** Append a timestamped Journal entry. */
function log(text,cat="System",at){S.journal.push({d:S.date,t:at??S.time,cat,text})}
function notify(title,body){S.notifications.push({id:"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:S.date,title,body,read:false})}
const C=()=>S.settings.clock;
/** Real minutes an action of `mins` nominal minutes takes, starting now (after 9 PM, work runs 25% slower). */
function actionCost(mins){const {lateStart,lateMult}=C();let t=S.time,left=mins,real=0;
  while(left>1e-9){if(t>=lateStart){real+=left*lateMult;left=0;break}const before=Math.min(left,lateStart-t);real+=before;t+=before;left-=before}
  return Math.round(real)}
/** Spend time on a tool action. Returns the real minutes used. */
function spend(mins,text,cat){const real=actionCost(mins);const at=S.time;S.time+=real;if(text)log(text+(real!==mins?` (${fmtDur(real)} — late penalty)`:""),cat,at);return real}
/** Story scenes move the clock by hand, with no late penalty. */
function scene(hours,note){const m=Math.round(hours*60);const at=S.time;S.time+=m;log(`Scene (${fmtDur(m)})${note?": "+note:""}`,"Story",at)}

/* ================================================================
   END DAY (Build Spec §7). Steps switch on in later milestones.
   ================================================================ */
let ending=false;
function endDay(){
  if(ending||!S)return;
  if(S.time<C().dayEnd-180&&!confirm(`End ${fmtDate(S.date)} at ${fmtTime(S.time)}?`))return;
  ending=true;
  try{
    const date=S.date;
    // 0. Guard: a date is never processed twice.
    if(S.processedDates.includes(date)){toast("This date was already processed.");return}
    const rep={date,endedAt:S.time,sections:{}};
    const line=(sec,t)=>(rep.sections[sec]=rep.sections[sec]||[]).push(t);
    // 1. Runtime security (overnight)
    for(const t of runSecurity())line("Security",t);
    // 2. Subscribers
    for(const t of runSubscribers())line("Subscribers",t);
    // 3. Planes and quests
    const rev={};
    for(const t of runQuests(rev))line("Planes and Contracts",t);
    for(const t of runContracts(rev))line("Planes and Contracts",t);
    // 4. Earned revenue
    const exp={};
    for(const t of runRevenue(rev,exp))line("Money",t);
    // staffing efficiency, once, on earned revenue (Phase II+)
    const eff=S.phase==="I"?1:staffingEfficiency();if(eff!==1){for(const k in rev)rev[k]*=eff;line("Guild",`Staffing efficiency ×${eff.toFixed(2)} on today's earnings.`)}
    for(const k in rev)rev[k]=Math.round(rev[k]*100)/100;
    const earned=Object.values(rev).reduce((s,v)=>s+v,0);
    // 5. Daily costs
    for(const t of runDailyCosts(rev,exp,earned))line("Money",t);
    if(earned){S.money.treasury+=earned;S.money.monthRevenue+=earned;for(const k in rev)S.money.monthBy[k]=(S.money.monthBy[k]||0)+rev[k];rep.revenue=rev;
      line("Money",`Earned ${fmtCr(earned)}: ${Object.entries(rev).filter(([k,v])=>v).map(([k,v])=>`${REVNAME[k]||k} ${fmtCr(v)}`).join(", ")}.`)}
    // book the day's costs
    for(const k in exp)exp[k]=Math.round(exp[k]*100)/100;
    const spent=Object.values(exp).reduce((s,v)=>s+v,0);
    if(spent){S.money.treasury-=spent;S.money.monthExpense+=spent;for(const k in exp)S.money.monthExpBy[k]=(S.money.monthExpBy[k]||0)+exp[k];rep.expenses=exp;
      line("Money",`Costs ${fmtCr(spent)}: ${Object.entries(exp).map(([k,v])=>`${EXPNAME[k]||k} ${fmtCr(v)}`).join(", ")}.`)}
    // 6. Month close
    const next=addDays(date,1);
    if(monthKey(next)!==monthKey(date)){
      line("Money",`${fmtMonth(monthKey(date))} closed. Earned ${fmtCr(S.money.monthRevenue)}, spent ${fmtCr(S.money.monthExpense)}.`);
      for(const t of monthClose(monthKey(date)))line("Money",t);
      for(const t of runGuildFellowship())line("Subscribers",t);
      for(const t of rollMonthlyOffers())line("Planes and Contracts",t);
      S.money.lastMonth={key:monthKey(date),revenue:S.money.monthRevenue,expense:S.money.monthExpense,by:{...S.money.monthBy},expBy:{...S.money.monthExpBy}};
      if(S.questExpiredMonth)line("Planes and Contracts",`${fmtMonth(monthKey(date))}: ${S.questExpiredMonth} unclaimed quest${S.questExpiredMonth>1?"s":""} expired Guild-wide.`);
      S.money.lastQuestExpired=S.questExpiredMonth||0;S.questExpiredMonth=0;for(const pl of S.planes){pl.lastExpired=pl.expiredMonth||0;pl.expiredMonth=0}
      S.money.monthRevenue=0;S.money.monthExpense=0;S.money.monthBy={};S.money.monthExpBy={};
      const fees=monthlyFees(monthKey(next));const ft=Object.values(fees).reduce((s,v)=>s+v,0);
      if(ft){S.money.treasury-=ft;S.money.monthExpense+=ft;for(const k in fees)S.money.monthExpBy[k]=fees[k];line("Money",`${fmtMonth(monthKey(next))} fees charged: ${Object.entries(fees).map(([k,v])=>`${EXPNAME[k]} ${fmtCr(v)}`).join(", ")}.`)}
    }
    if(S.emerson.down?.until&&next>=S.emerson.down.until){const was=S.emerson.down.reason;S.emerson.down=null;line("Guild",was==="rebuild"?"Character Creator finished rebuilding Emerson. She's back.":"REBOOT restored Emerson's link to the Concept. She's back.");notify("Emerson is back","Her actions are unlocked.")
    }
    // 7. Wrap-up
    if(!Object.keys(rep.sections).length)line("Runtime","A quiet night in the Runtime.");
    S.reports.push(rep);
    const summary=Object.values(rep.sections).flat().join(" ");
    log(`End Day at ${fmtTime(S.time)}. ${summary}`,"End Day");
    S.processedDates.push(date);
    S.date=next;S.time=C().dayStart;
    log(`Good morning. ${fmtDateLong(next)}.`,"System");
    commit("endday");
    UI.modal={type:"report",date};render();
  }finally{ending=false}
}

   SAVE: browser copy + private GitHub data repo (same split as Finn's tools)
   ================================================================ */
const LS={catDirty:"tgc.catDirty",cardsSha:"tgc.cardsSha",save:"tgc.save",gh:"tgc.gh",db:"tgc.db",dirty:"tgc.dirty",synced:"tgc.syncedAt",sha:"tgc.saveSha",tab:"tgc.tab"};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){console.warn(e);return false}}
let syncState="off",syncMsg="Not connected to GitHub",pushTimer=null;
function saveLocal(dirty){if(!S)return;lsSet(LS.save,S);if(dirty){lsSet(LS.dirty,true);if(GH.ready()){syncState="dirty";syncMsg="Unsynced changes";if(GH.mode()==="change"){clearTimeout(pushTimer);pushTimer=setTimeout(()=>GH.pushSave(),12000)}}}}
/** Call after any change to the state. */
function commit(reason){S.meta.savedAt=Date.now();saveLocal(true);if(reason==="endday"&&GH.ready()&&GH.mode()!=="manual")GH.pushSave()}
const b64enc=s=>{const b=new TextEncoder().encode(s);let bin="";for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const GH={
  cfg(){return lsGet(LS.gh,null)},
  ready(){const c=this.cfg();return !!(c&&c.owner&&c.repo&&c.token)},
  mode(){return (this.cfg()||{}).mode||"change"},
  url(path,withRef){const c=this.cfg();return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`+(withRef?`?ref=${encodeURIComponent(c.branch||"main")}`:"")},
  headers(){return {Authorization:"Bearer "+this.cfg().token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}},
  async get(path){
    const r=await fetch(this.url(path,true),{headers:this.headers(),cache:"no-store"});
    if(r.status===404)return null;
    if(!r.ok)throw new Error(`GitHub ${r.status} reading ${path}: ${(await r.text()).slice(0,140)}`);
    const j=await r.json();let text;
    if(j.content&&j.encoding==="base64")text=b64dec(j.content);
    else{const r2=await fetch(this.url(path,true),{headers:{...this.headers(),Accept:"application/vnd.github.raw+json"},cache:"no-store"});text=await r2.text()}
    return {data:JSON.parse(text),sha:j.sha};
  },
  async put(path,data,sha,message){
    const c=this.cfg();
    const body={message,content:b64enc(JSON.stringify(data,null,1)),branch:c.branch||"main"};if(sha)body.sha=sha;
    const r=await fetch(this.url(path,false),{method:"PUT",headers:{...this.headers(),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok){const e=new Error(`GitHub ${r.status} saving ${path}`);e.status=r.status;throw e}
    return (await r.json()).content.sha;
  },
  /** Move the cards you made into cards.json in the data repo. Ids stay the same, so hand, Codex and projects keep working. */
  /** Write the whole catalog to cards.json. Asks before overwriting changes made elsewhere. */
  async saveCatalog(){
    const rem=await this.get("cards.json");const known=lsGet(LS.cardsSha,null);
    if(rem&&known&&rem.sha!==known&&!confirm("cards.json on GitHub changed since this browser loaded it (another device?). Overwrite it with this browser's catalog?"))return false;
    const sha=await this.put("cards.json",catalogData(),rem?.sha,"Update the card catalog from the console");
    lsSet(LS.cardsSha,sha);lsSet(LS.catDirty,false);if(CAT.source!=="repo")CAT.source="repo";return true;
  },
  async loadDBs(){const [cd,pd]=await Promise.all([this.get("cards.json"),this.get("planes.json")]);const db=lsGet(LS.db,{})||{};
    if(cd){if(catDirty()){db.cardsRemoteSha=cd.sha}else{setCards(cd.data);db.cards=cd.data;lsSet(LS.cardsSha,cd.sha)}}if(pd){setPlanes(pd.data);db.planes=pd.data}lsSet(LS.db,db);return {cards:!!cd,planes:!!pd}},
  async savePlanesToRepo(){const rem=await this.get("planes.json");const data=rem?rem.data:JSON.parse(JSON.stringify(DEFAULT_PLANES));const {merged,moved}=mergeMyPlanes(data);
    await this.put("planes.json",merged,rem?.sha,`Add ${moved} plane${moved===1?"":"s"} from the console`);setPlanes(merged);const db=lsGet(LS.db,{})||{};db.planes=merged;lsSet(LS.db,db);return moved},
  async pullSave(force){
    const rem=await this.get("save.json");
    if(!rem){lsSet(LS.sha,null);return "none"}
    lsSet(LS.sha,rem.sha);
    const remoteAt=rem.data.meta?.savedAt||0,localAt=S?.meta?.savedAt||0,dirty=lsGet(LS.dirty,false);
    if(force||!S||(!dirty&&remoteAt>=localAt)){S=migrate(rem.data);recomputeRuntime();saveLocal(false);lsSet(LS.dirty,false);lsSet(LS.synced,remoteAt);return "loaded"}
    if(dirty&&remoteAt>(lsGet(LS.synced,0))){
      if(confirm("GitHub has a newer save than the last one this browser synced, and this browser also has unsynced changes.\n\nOK = load GitHub's save (this browser's changes are dropped)\nCancel = keep this browser's save (it will overwrite GitHub on next sync)")){S=migrate(rem.data);saveLocal(false);lsSet(LS.dirty,false);lsSet(LS.synced,remoteAt);return "loaded"}
    }
    return "kept";
  },
  async pushSave(){
    if(!this.ready()||!S)return;
    clearTimeout(pushTimer);
    if(this.busy){this.again=true;return}
    this.busy=true;
    try{await this._push()}finally{this.busy=false}
    if(this.again){this.again=false;return this.pushSave()}
  },
  async _push(){
    syncState="busy";syncMsg="Saving to GitHub…";renderStatus();
    const msg=`${S.date} ${fmtTime(S.time)}`;
    try{
      let sha=lsGet(LS.sha,null);
      try{sha=await this.put("save.json",S,sha,msg)}
      catch(e){
        if(e.status===409||e.status===422){
          const rem=await this.get("save.json");const remoteAt=rem?.data?.meta?.savedAt||0;
          if(rem&&remoteAt>lsGet(LS.synced,0)&&!confirm("GitHub's save changed since this browser last synced (another device?). Overwrite it with this browser's save?"))throw new Error("Sync paused — resolve in Settings");
          sha=await this.put("save.json",S,rem?.sha,msg);
        }else throw e;
      }
      lsSet(LS.sha,sha);lsSet(LS.dirty,false);lsSet(LS.synced,S.meta.savedAt);
      syncState="ok";syncMsg="Saved to GitHub "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    }catch(e){syncState="err";syncMsg=e.message;console.error(e)}
    renderStatus();
  },
};

/* ---- the Runtime map: one node per deployed project; tap a node to zoom into its constellation ---- */
function nodeLayout(ps,W,H){
  const pos=[],pad=16,minD=Math.max(14,Math.min(44,Math.sqrt(W*H/Math.max(1,ps.length))*.55));
  ps.forEach((p,i)=>{const r=mulberry32(hashStr("node:"+p.id)%4294967296);let best=null,bd=-1;
    for(let k=0;k<40;k++){const x=pad+r()*(W-2*pad),y=pad+r()*(H-2*pad);const d=pos.reduce((m,q)=>Math.min(m,Math.hypot(q.x-x,q.y-y)),1e9);if(d>=minD){best={x,y};break}if(d>bd){bd=d;best={x,y}}}
    pos.push({...best,p})});

}
function runtimeMapSVG(){
  const ps=S.projects.filter(p=>p.status==="live"||p.status==="offline");if(!ps.length)return "";
  const W=340,H=190,pos=nodeLayout(ps,W,H);let lines="",nodes="";
  pos.forEach((a,i)=>{let nb=null,nd=1e9;pos.forEach((b,j)=>{if(j<i){const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<nd){nd=d;nb=b}}});if(nb)lines+=`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${nb.x.toFixed(1)}" y2="${nb.y.toFixed(1)}"/>`});
  for(const {x,y,p} of pos){const off=p.status==="offline",ip=p.integrity/p.maxIntegrity,sel=UI.node===p.id;
    const r=2.6+Math.min(4.5,Math.log2(1+p.baseHours)*.9),col=off?"#4b5270":ip<.35?"#e2645c":ip<.7?"#e8a33c":"#f1d48c";
    nodes+=`<g class="node${sel?" sel":""}" data-node="${p.id}" role="button" tabindex="0" aria-label="${esc(p.name)}"><title>${esc(p.name)} · ${off?"offline":`V${p.version} · ${Math.round(p.integrity)}%`}</title>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r*3).toFixed(1)}" fill="${col}" opacity="${off?.04:.12}"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}"/>
      ${p.bugsKnown?`<circle cx="${(x+r+1.5).toFixed(1)}" cy="${(y-r-1).toFixed(1)}" r="1.8" fill="#7a5d1a" stroke="#d9b25a" stroke-width=".6"/>`:""}
      ${sel?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r+5).toFixed(1)}" fill="none" stroke="#f1d48c" stroke-width="1"/>`:""}
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14" fill="transparent"/></g>`}
  return `<svg viewBox="0 0 ${W} ${H}" class="consts" role="group" aria-label="Deployed projects"><g stroke="#d9b25a" stroke-width=".5" opacity=".22">${lines}</g>${nodes}</svg>`;
}
/** A single project's constellation, drawn from its id. */
function constellationSVG(p){
  const r=mulberry32(hashStr(p.id)%4294967296),W=220,H=130,cx=W/2,cy=H/2;
  const n=3+Math.min(6,Math.round(Math.log2(1+p.baseHours))),pts=[];
  for(let k=0;k<n;k++){const a=r()*Math.PI*2,d=14+r()*48;pts.push([cx+Math.cos(a)*d*1.4,cy+Math.sin(a)*d*.8])}
  pts.sort((a,b)=>a[0]-b[0]);const off=p.status==="offline",op=off?.3:.5+.5*(p.integrity/p.maxIntegrity);
  return `<svg viewBox="0 0 ${W} ${H}" class="const1" aria-hidden="true"><g opacity="${op.toFixed(2)}"><polyline points="${pts.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#d9b25a" stroke-width="1" opacity=".6"/>
    ${pts.map((q,k)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${k===0?3.6:2.2+p.version*.25}" fill="${k===0?"#f1d48c":"#d9b25a"}"/>`).join("")}
    ${pts.slice(1,1+Math.min(pts.length-1,p.bugsKnown)).map(q=>`<g transform="translate(${(q[0]+5).toFixed(1)},${(q[1]+2).toFixed(1)}) scale(.5)">${SCARAB("#d9b25a","#7a5d1a").replace(/<\/?svg[^>]*>/g,"")}</g>`).join("")}</g></svg>`;
}

/* ---------------- Markdown: Snapshot and Export a day ---------------- */
function snapshotMD(){
  const e=S.emerson,m=S.money,L=[];
  L.push(`# The Guild — Snapshot`,`${fmtDateLong(S.date)}, ${fmtTime(S.time)} · ${STAGES[S.stage]} · ${PHASES[S.phase]}`,"");
  L.push(`## Emerson`,`- Concept Level ${e.level} (${fmtN(e.xp)} / ${fmtN(xpToNext(e.level))} XP)${e.unspentPoints?` · ${e.unspentPoints} unspent stat point(s)`:""}`,`- Authority ${e.stats.authority} · Thought ${e.stats.thought} · Flesh ${e.stats.flesh}`,`- Efficiency ${pct(efficiency())} · Purge ${pct(purgePct())} · Patch +${patchAmt()} · latent Bugs −${pct(latentBugCut())}`,"");
  L.push(`## Runtime`,`- Capacity: ${usedCapacity()} active / ${safeCapacity()} safe / ${S.runtime.maxCapacity} max · efficiency ${pct(efficiency())}`,`- Kernel Panic ${S.runtime.kernelPanicCharged?"charged":"spent"} · Antivirus ${S.runtime.antivirus?"live":"not built"} · PEST CONTROL rank ${S.runtime.pestRank}`,`- Incursions: ${S.incursions.length?S.incursions.length:"none"}`,"");
  L.push(`## Projects`);if(!S.projects.length)L.push("- None deployed yet");L.push("");
  L.push(`## Foundation track`);for(const c of coreCards()){const st=isLive(c.id)?"live":S.foundation.unlocked.includes(c.id)?"unlocked":"locked";L.push(`- ${c.step==="special"?"Special":"Step "+c.step}: ${c.name} — ${st}`)}L.push("");
  const held=Object.keys(S.cards).filter(k=>S.cards[k]>0);
  L.push(`## Cards and shards`,`- In hand: ${held.length?held.map(k=>cardName(k)+(S.cards[k]>1?` ×${S.cards[k]}`:"")).join(", "):"none"}`,`- Unopened packs: ${S.packs.length}`,`- Glyph shards: ${S.shards}`,`- Codex entries: ${Object.keys(S.codex).length}`,"");
  L.push(`## Subscribers`,`- Active ${activeCount()} · Trial ${trialCount()} · Lapsed ${sumTiers(S.subs.lapsed)} · Waitlist ${S.subs.waitlist}`,`- Tier mix: ${TIERS.map(t=>`${t} ${tierTotal(t)}`).join(", ")}`,`- Hype: ${hypeNow().name||"none"} · drought ${droughtNow().days} days (churn ×${droughtNow().mult.toFixed(1)})`,"");
  L.push(`## Money`,`- Guild treasury: ${fmtCr(m.treasury)} · Emerson's wallet: ${fmtCr(m.wallet)}`,`- This month: revenue ${fmtCr(m.monthRevenue)}, expenses ${fmtCr(m.monthExpense)}`,`- Reserve ${fmtCr(m.reserve)} · Expansion fund ${fmtCr(m.expansionFund)} · Fellowship fund ${fmtCr(m.fellowshipFund)}`,...S.investors.map(i=>`- Investor: ${i.name}, ${i.units} units, paid ${fmtCr(i.paid)} of ${fmtCr(i.cap)}`),"");
  L.push(`## Planes`,...S.planes.map(p=>`- ${p.name}: Standing Lv ${p.level}, demand ${p.demand}, Registry ${p.registryActive?"active":"not active"}, ${p.waystones.length} Waystone(s)${p.innDoor?", Inn door":""}`),"");
  L.push(`## Contracts`,S.contracts.length?S.contracts.map(c=>`- ${c.party}: ${CTYPES[c.type]||c.type}${c.type==="sponsored"?`, ${c.members} members`:`, ${fmtCr(c.value)} ${CSCHED[c.schedule]||""}`} (${contractLive(c)?"active":c.ended?"ended":"pending"})`).join("\n"):"- None","");
  L.push(`## Fellowships`,`- Guild Fellowship: ${sponsoredBy("guild")} sponsored · Founder's Fellowship: ${sponsoredBy("founder")} sponsored by Emerson`,"");
  {const js=S.releases.filter(r=>r.journey);if(js.length)L.push(`## Hero's Journeys`,...js.map(j=>`- ${journeyName(j)} (${j.date}): ${j.jStd||0} Standard, ${j.jPre||0} Premium, ${j.jUpg||0} upgrades, ${j.jClaims||0} free claims, ${fmtCr(j.jRev||0)}`),"")}
  if(S.emerson.down)L.push(`## Status`,`- Emerson is down: ${DOWN_NAME[S.emerson.down.reason]}${S.emerson.down.until?`, back ${S.emerson.down.until}`:""}`,"");
  if((S.devLog||[]).length)L.push(`## Latest Dev Log`,`- ${S.devLog.at(-1).date}: ${S.devLog.at(-1).title||"Untitled"}`,"");
  L.push(`## Housing`,S.housing.neighborhoods.length?`- ${S.housing.neighborhoods.length} neighborhood(s)`:"- Housing Plane not built","");
  L.push(`## Recent journal`);for(const j of S.journal.slice(-12))L.push(`- ${j.d} ${fmtTime(j.t)} [${j.cat}] ${j.text}`);
  return L.join("\n");
}
const EXPORT_SECTIONS=["Development","Security","Cards","Guild","Subscribers","Planes and Contracts","Money","Dev Logs"];
function exportDayMD(date){
  const ents=S.journal.filter(j=>j.d===date),L=[`# ${fmtDateLong(date)} — The Guild`,""];
  const rep=S.reports.find(r=>r.date===date);
  for(const sec of EXPORT_SECTIONS){const items=ents.filter(j=>j.cat===sec);const rl=rep?.sections?.[sec]||[];L.push(`## ${sec}`);if(!items.length&&!rl.length)L.push("- Nothing");for(const j of items)L.push(`- ${fmtTime(j.t)}: ${j.text}`);for(const t of rl)L.push(`- Overnight: ${t}`);L.push("")}
  L.push(`## Journal`);for(const j of ents)L.push(`- ${fmtTime(j.t)} [${j.cat}] ${j.text}`);
  return L.join("\n");
}

        if(f.pack==="Item"){c.itemType=f.itemType;c.effect={type:"item"}}
        else if(f.pack==="DevTools"){c.src={kind:f.src,n:f.n===""?null:+f.n,rarity:f.rarity};c.hours=devToolHours(c.src);c.source=DEVSRC[f.src]+(f.n!==""&&!["ygo-spell","mtg-land","zero"].includes(f.src)?" "+f.n:"");c.effect={type:"ability"}}
        else if(f.pack==="Perk"){c.repeatable=f.repeatable;if(f.repeatable&&f.maxRank!=="")c.maxRank=+f.maxRank;c.effect={type:"custom"}}
        else if(f.pack==="Class"){c.tier=f.tier;c.needs=f.needs.filter(Boolean)}
        else{c.needs=f.needs.filter(Boolean).slice(0,1);c.effect={type:"custom"}}}
      for(const k in c)if(c[k]===undefined)delete c[k];
      commitCatalog(data);UI.modal={type:"card",id:c.id};render();toast(isNew?"Added to the catalog":"Saved");break}
    case "makerDelete":{const id=UI.modal.id,c=getCard(id);if(!c||c.retired)return;const r=cardRefs(id);
      const msg=r.projects||r.codex?`Delete ${c.name}? Emerson has ${r.projects?"built":"discovered"} it, so it's retired instead: it stops dropping and can't be bought, but her projects and Codex keep its name.${r.held?` The ${r.held} cop${r.held>1?"ies":"y"} in her hand are removed.`:""}`:`Delete ${c.name} from the catalog?${r.held?` The ${r.held} cop${r.held>1?"ies":"y"} in her hand are removed.`:""}`;
      if(!confirm(msg))return;const how=deleteCard(id);if(S&&r.held)commit();UI.modal=null;render();toast(how==="retired"?`${c.name} retired`:`${c.name} deleted`);break}
    case "cardRestore":{restoreCard(a.dataset.id);render();toast("Restored");break}
    case "catSave":{syncState="busy";syncMsg="Saving cards.json…";renderStatus();try{if(await GH.saveCatalog()){toast("cards.json saved");syncState="ok";syncMsg="cards.json saved"}else{syncState="ok";syncMsg="Catalog not saved"}}catch(e){syncState="err";syncMsg=e.message;toast(e.message,4000)}render();break}
    case "catDownload":download("cards.json",JSON.stringify(catalogData(),null,1));toast("Upload it to the data repo; then Reload cards & planes and the unsaved flag clears",5000);break;
    case "catDiscard":{if(!confirm("Throw away this browser's catalog changes and reload cards.json from GitHub?"))return;lsSet(LS.catDirty,false);try{await GH.loadDBs();toast("Catalog reloaded")}catch(e){toast(e.message)}render();break}
    case "setNew":UI.modal={type:"set"};render();break;
    case "setEdit":UI.modal={type:"set",id:a.dataset.id};render();break;
    case "setSave":{const name=$("#stName").value.trim(),sym=$("#stSym").value.trim().slice(0,2)||"◇";if(!name){toast("Name it");return}
      if(UI.modal.id)editSet(UI.modal.id,name,sym);else addSet(name,sym);UI.modal=null;render();toast("Saved");break}
    case "setDel":UI.modal={type:"setDel",id:a.dataset.id};render();break;
    case "setDelGo":{const to=$("#stTo").value;const n=deleteSet(UI.modal.id,to);if(S)commit();UI.modal=null;render();toast(`Set deleted; ${n} card${n===1?"":"s"} moved`);break}
    case "edMove":{const to=$("#edMoveTo").value;const n=moveCards(edState().sel,to);edState().sel=[];render();toast(`${n} moved to ${setName(to)}`);break}
    case "edSelNone":edState().sel=[];render();break;
    case "scene":UI.modal={type:"scene"};render();setTimeout(()=>$("#sceneHrs")?.focus(),30);break;
    case "sceneGo":{const h=parseFloat($("#sceneHrs").value);if(!(h>0)||h>24){toast("Enter hours between 0 and 24");return}scene(h,$("#sceneNote").value.trim());commit();UI.modal=null;render();toast(`Clock: ${fmtTime(S.time)}`);break}
    case "export":if(!S){toast("No save yet");return}download(`guild-save-${S.date}.json`,JSON.stringify(S,null,1));break;
    case "import":$("#importFile").click();break;
    case "newGame":{if(!confirm("Start a new save? This browser's save is replaced (export a backup first). If GitHub is connected, the next sync overwrites save.json there too."))return;const d=prompt("Founding date (YYYY-MM-DD)",S.startDate);if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return;newGame(d);go("projects");break}
    case "ghConnect":await ghConnect();break;
    case "ghPush":await GH.pushSave();render();break;
    case "ghPull":{if(!confirm("Load save.json from GitHub, replacing this browser's save?"))return;syncState="busy";syncMsg="Loading…";renderStatus();try{const r=await GH.pullSave(true);syncState="ok";syncMsg=r==="none"?"No save.json on GitHub yet":"Loaded from GitHub";}catch(e){syncState="err";syncMsg=e.message}render();break}
    case "ghReloadCards":try{const g=await GH.loadDBs();toast(`${g.cards?`${CAT.cards.length} cards`:"No cards.json (built-in cards)"} · ${g.planes?`${PCAT.planes.length} planes`:"no planes.json (built-in planes)"}`,4000)}catch(e){toast(e.message)}render();break;
    case "ghForget":{const c=GH.cfg()||{};delete c.token;lsSet(LS.gh,c);syncState="off";syncMsg="Not connected to GitHub";render();break}
  }
});
document.addEventListener("keydown",ev=>{if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches?.("[data-card],[data-node],.chamber")){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
function readMaker(){const f=UI.mk,v=id=>$(id)?.value;if(!f)return;
  f.name=v("#mkName")??f.name;f.rarity=v("#mkRar")??f.rarity;f.set=v("#mkSet")??f.set;f.desc=v("#mkDesc")??f.desc;f.flavor=v("#mkFlavor")??f.flavor;
  if($("#mkType"))f.itemType=v("#mkType");if($("#mkSrc")){f.src=v("#mkSrc");f.n=v("#mkN")}
  if($("#mkRep")){f.repeatable=$("#mkRep").checked;f.maxRank=v("#mkMax")}if($("#mkTier"))f.tier=v("#mkTier");
  if($("#mkNeed1"))f.needs=[v("#mkNeed1"),v("#mkNeed2")||""].filter(x=>x!==undefined)}
document.addEventListener("input",ev=>{if(ev.target.id==="cxQ"){UI.cx.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$("#cxQ");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}return}
  if(ev.target.id==="edQ"){edState().q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$("#edQ");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}}});
document.addEventListener("change",ev=>{
  const edMap={edSet:"set",edPack:"pack",edRar:"rar",edType:"type"};if(edMap[ev.target.id]){edState()[edMap[ev.target.id]]=ev.target.value;render();return}
  if(ev.target.id==="edRet"){edState().retired=ev.target.checked;render();return}
  if(ev.target.classList.contains("edsel")){const e=edState(),id=ev.target.dataset.id;e.sel=ev.target.checked?[...new Set([...e.sel,id])]:e.sel.filter(x=>x!==id);render();return}
  if(ev.target.id==="pkSet"&&UI.modal?.type==="pick"){UI.modal.set=ev.target.value;render();return}
  if(ev.target.classList.contains("bsel")){const p=S.projects.find(x=>x.id===ev.target.dataset.p),isJob=ev.target.dataset.job==="1",bid=ev.target.value||null;if(!p)return;
    const oldB=isJob?p.job.bundleId:p.bundleId;
    if(!isJob&&oldB&&bid!==oldB){const hold=heldByStagedParent(p);if(hold){toast(`${p.name} needs ${cardName(hold)}, which is only staged in ${bundleById(oldB).name}. It has to launch with it.`,5000);render();return}
      const deps=dependentsInBundle(p,oldB);if(deps.length&&!confirm(`Taking ${p.name} out of ${bundleById(oldB).name} also takes out ${deps.map(d=>d.name).join(", ")}, which depend on it. Their reserved cards go back to her hand. Continue?`)){render();return}
      cascadeOut(p,oldB)}
    if(bid){const b=bundleById(bid),why=bundleFits(b,getCard(p.cardId));if(why){toast(why,4500);render();return}if(isJob)p.job.bundleId=bid;else{p.bundleId=bid;if(p.status==="staged")p.status="testing"}log(`Added ${isJob?`the ${p.name} upgrade`:p.name} to ${b.name}.`,"Development")}
    else{unbundle(p,isJob);log(`Took ${p.name} out of its bundle.`,"Development")}commit();render();return}
  if(ev.target.id==="npBundle"&&UI.modal?.type==="newProject"){UI.modal.bundle=ev.target.value||null;render();return}
  if(ev.target.id==="plCat"&&UI.modal?.type==="plane"){UI.modal.cat=ev.target.value||null;render();return}
  if(ev.target.id==="mkPack"){readMaker();UI.mk.pack=ev.target.value;UI.mk.needs=[];render();return}
  if(ev.target.id==="jMonth"){UI.jMonth=ev.target.value;render()}
  {const cx={cxPack:"pack",cxRar:"rar",cxRank:"rank",cxSort:"sort"}[ev.target.id];if(cx){UI.cx[cx]=ev.target.value;render();return}if(ev.target.id==="cxHand"){UI.cx.hand=ev.target.checked;render();return}}
  if(ev.target.dataset?.tun){setTunable(ev.target.dataset.tun,ev.target.dataset.kind,ev.target);return}
  if(ev.target.id==="ctType"&&UI.modal?.type==="contract"){UI.modal.ctype=ev.target.value;UI.modal.draft={party:$("#ctParty").value,plane:$("#ctPlane").value,notes:$("#ctNotes").value};render();const dr=UI.modal.draft;$("#ctParty").value=dr.party;$("#ctPlane").value=dr.plane;$("#ctNotes").value=dr.notes;return}
  if(ev.target.id==="exDay"){UI.exportDay=ev.target.value}
});
$("#importFile").addEventListener("change",async ev=>{
  const f=ev.target.files[0];ev.target.value="";if(!f)return;
  try{const data=JSON.parse(await f.text());
    if(!data||data.meta?.app!=="the-guild-console"||!data.emerson||!data.date)throw new Error("That file isn't a Guild Console save.");
    if(S&&!confirm(`Replace this browser's save (${fmtDate(S.date)}) with the file's (${fmtDate(data.date)})?`))return;
    S=migrate(data);commit("import");toast("Save imported");go("projects");
  }catch(e){toast(e.message,4000)}
});
async function ghConnect(){
  const c={owner:$("#ghOwner").value.trim(),repo:$("#ghRepo").value.trim(),branch:$("#ghBranch").value.trim()||"main",token:$("#ghToken").value.trim(),mode:$("#ghMode").value};
  lsSet(LS.gh,c);
  if(!GH.ready()){toast("Fill in owner, repo and token.");return}
  syncState="busy";syncMsg="Connecting…";render();
  try{
    const got=await GH.loadDBs();
    const r=await GH.pullSave(false);
    if(r==="none"){if(S)await GH.pushSave();else{syncState="ok";syncMsg="Connected — no save on GitHub yet"}}
    else{syncState=lsGet(LS.dirty,false)?"dirty":"ok";syncMsg=r==="loaded"?"Loaded save from GitHub":"Connected — this browser's save kept"}
    toast(S?`Connected. ${CAT.cards.length} cards${got.cards?"":" (no cards.json in the repo — using the built-in copy)"}.`:`Connected. No save on GitHub yet — pick a founding date to begin.`,3500);
    if(!S||r==="loaded"){UI.tab="projects";lsSet(LS.tab,"projects")}
  }catch(err){syncState="err";syncMsg=err.message}
  render();
}

/* ---------------- starfield (drawn in code) ---------------- */
function drawSky(){
  const cv=$("#sky"),dpr=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);
  const bg=g.createRadialGradient(w*.7,h*.15,0,w*.7,h*.15,Math.max(w,h));bg.addColorStop(0,"#121a3f");bg.addColorStop(.55,"#0a1029");bg.addColorStop(1,"#05081a");g.fillStyle=bg;g.fillRect(0,0,w,h);
  const r=mulberry32(1081026);const n=Math.round(w*h/2600);
  for(let i=0;i<n;i++){const x=r()*w,y=r()*h,s=r()<.06?1.4:r()*.9+.2,a=.25+r()*.6;g.fillStyle=r()<.12?`rgba(241,212,140,${a})`:`rgba(220,226,255,${a})`;g.beginPath();g.arc(x,y,s,0,7);g.fill()}
  // a few faint golden constellations
  g.strokeStyle="rgba(217,178,90,.13)";g.lineWidth=1;
  for(let k=0;k<4;k++){let x=r()*w,y=r()*h;g.beginPath();g.moveTo(x,y);const pts=[[x,y]];for(let j=0;j<5;j++){x+=(r()-.5)*160;y+=(r()-.5)*120;g.lineTo(x,y);pts.push([x,y])}g.stroke();g.fillStyle="rgba(241,212,140,.5)";for(const [px,py] of pts){g.beginPath();g.arc(px,py,1.6,0,7);g.fill()}}
}
let skyT;addEventListener("resize",()=>{clearTimeout(skyT);skyT=setTimeout(drawSky,150)});

/* ================================================================
   BOOT
   ================================================================ */
(async function boot(){
  drawSky();
  const db=lsGet(LS.db,null);setCards(db&&db.cards?db.cards:DEFAULT_CARDS);setPlanes(db&&db.planes?db.planes:DEFAULT_PLANES);
  const local=lsGet(LS.save,null);
  if(local){S=migrate(local);recomputeRuntime();if(checkFoundation())saveLocal(true);if(foldCustomCards())saveLocal(true)}else UI.tab="projects";
  render();
  if(GH.ready()){
    syncState="busy";syncMsg="Syncing…";renderStatus();
    try{await GH.loadDBs();const r=await GH.pullSave(false);if(r==="none"&&S)await GH.pushSave();
      else{syncState=lsGet(LS.dirty,false)?"dirty":"ok";syncMsg=lsGet(LS.dirty,false)?"Unsynced changes":"In sync with GitHub"}}
    catch(e){syncState="err";syncMsg=e.message}
    render();
  }
  addEventListener("beforeunload",()=>{if(GH.ready()&&lsGet(LS.dirty,false)&&GH.mode()!=="manual")GH.pushSave()});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&GH.ready()&&lsGet(LS.dirty,false)&&GH.mode()==="change")GH.pushSave()});
})();
</script>
