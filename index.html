<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>The Guild Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b1a'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23d9b25a'/%3E%3Cpath d='M22 32c-6-1-12-5-16-11 5 2 10 3 15 3-4-1-8-3-11-6 4 1 9 2 13 2' fill='none' stroke='%23d9b25a' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M42 32c6-1 12-5 16-11-5 2-10 3-15 3 4-1 8-3 11-6-4 1-9 2-13 2' fill='none' stroke='%23d9b25a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#070b1a; --bg2:#0b1128; --panel:rgba(13,19,42,.86); --panel2:rgba(20,28,58,.9);
  --line:rgba(217,178,90,.22); --line2:rgba(217,178,90,.45);
  --gold:#d9b25a; --gold2:#f1d48c; --text:#ebe6d6; --muted:#97a0b6; --dim:#6b7390;
  --teal:#45b8a9; --amber:#e8a33c; --red:#e2645c; --violet:#8f7ee0; --navy:#253F79;
  --r:12px; --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 12px 40px}
a{color:var(--gold2)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0}
h2{font-size:1.25rem;color:var(--gold2)}
h3{font-size:1.02rem;color:var(--gold)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.84rem}
.gold{color:var(--gold2)} .warn{color:var(--amber)} .bad{color:var(--red)} .good{color:var(--teal)}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:20;margin:0 -12px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,rgba(7,11,26,.97),rgba(7,11,26,.9));border-bottom:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{width:34px;height:22px;flex:none}
.brand b{font-family:var(--serif);font-size:1.05rem;color:var(--gold2);white-space:nowrap}
.sync{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none;border:0;padding:0;cursor:pointer}
.sync.ok{background:var(--teal)} .sync.dirty{background:var(--amber)} .sync.busy{background:var(--gold2);animation:pulse 1s infinite} .sync.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.clock{margin-left:auto;text-align:right;line-height:1.15}
.clock .d{font-size:.8rem;color:var(--muted)}
.clock .t{font-family:var(--mono);font-size:1.15rem;color:var(--text)}
.clock.late .t{color:var(--amber)} .clock.over .t{color:var(--red)}
.clock .lw{font-size:.7rem;color:var(--amber)}
.stats{margin-top:7px;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:.8rem;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:600;color:var(--gold2)}
.chip.stage{border-color:var(--line2);color:var(--gold2)}
.lvl{display:flex;align-items:center;gap:6px;flex:1 1 150px;min-width:150px}
.bar{position:relative;height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;flex:1}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.bar.teal>i{background:linear-gradient(90deg,#2d8e83,var(--teal))}
.bar.violet>i{background:linear-gradient(90deg,#5e50b0,var(--violet))}
.iconbtn{position:relative;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:3px 9px;font-size:.8rem;cursor:pointer}
.iconbtn .n{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:9px;background:var(--red);color:#fff;font-size:.65rem;line-height:16px;text-align:center;padding:0 4px}

/* ---------- tabs ---------- */
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:8px -12px 0;padding:0 12px 2px}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 11px;border-radius:999px;font-size:.86rem;cursor:pointer}
#tabs button.on{color:var(--bg);background:var(--gold);font-weight:600}
#tabs button:not(.on):hover{border-color:var(--line)}

/* ---------- panels ---------- */
#view{padding-top:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.grid>*{min-width:0}
.panel{overflow-x:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative}
.panel+.panel,.grid+.panel,.panel+.grid{margin-top:12px}
.grid .panel+.panel{margin-top:0}
.panel>h2,.panel>h3{margin-bottom:8px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.hd h2,.hd h3{margin:0}
.soon{border-style:dashed;border-color:rgba(217,178,90,.18);background:rgba(13,19,42,.55)}
.soon .tag{font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid rgba(217,178,90,.1);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right;font-family:var(--mono)}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
ul.plain{margin:0;padding-left:18px} ul.plain li{margin:2px 0}

/* ---------- controls ---------- */
button.btn,.btn{appearance:none;background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:8px 13px;font:inherit;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;border-color:var(--gold2);font-weight:600}
.btn.danger{border-color:rgba(226,100,92,.6);color:#ffb3ad}
.btn.small{padding:5px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label.f{display:block;font-size:.82rem;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;background:rgba(5,8,20,.75);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#endDay{white-space:nowrap}

/* ---------- cards ---------- */
.cardrow{display:flex;gap:10px;flex-wrap:wrap}
.gcard{width:150px;min-height:170px;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(160deg,#141c3c,#0a0f24);border:1px solid var(--line2);position:relative;overflow:hidden}
.gcard::after{content:"";position:absolute;inset:4px;border:1px solid rgba(217,178,90,.15);border-radius:9px;pointer-events:none}
.gcard .rar{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase}
.gcard .nm{font-family:var(--serif);font-size:.98rem;color:var(--gold2);line-height:1.2}
.gcard .meta{font-size:.74rem;color:var(--muted);margin-top:auto}
.gcard .ct{position:absolute;top:8px;right:9px;font-family:var(--mono);font-size:.75rem;color:var(--gold2)}
.r-C{color:#b8bfcf} .r-U{color:#62c7b8} .r-R{color:#e3b955} .r-M{color:#e07a5f}
.gcard.core{border-color:var(--gold2);box-shadow:0 0 18px rgba(217,178,90,.15) inset}
.gcard[data-card]{cursor:pointer}.gcard[data-card]:hover{border-color:var(--gold2)}
.gcard .fl{font-style:italic;font-size:.74rem;line-height:1.3}
.gcard.g-R{box-shadow:0 0 16px rgba(227,185,85,.22)} .gcard.g-M{box-shadow:0 0 20px rgba(224,122,95,.35);border-color:#e07a5f}
.newtag{position:absolute;top:7px;right:8px;font:600 .62rem var(--mono);letter-spacing:.08em;color:#1a1405;background:var(--gold2);border-radius:4px;padding:1px 5px;z-index:1}
.gcard .ct+.newtag{top:24px}
.flip{animation:flipin .55s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes flipin{from{transform:perspective(600px) rotateY(95deg) scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){.flip{animation:none}}
.reveal{justify-content:center}
.mbox.wide{max-width:720px}
.packs{display:flex;flex-direction:column;gap:6px}
.packrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid rgba(217,178,90,.15);border-radius:9px;margin-top:6px}
.catbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:10px 12px;margin-top:8px;font:inherit;cursor:pointer}
.catbtn b{font-family:var(--serif);color:var(--gold2);font-size:1.05rem}
.catbtn:disabled{opacity:.45;cursor:not-allowed}
.catbtn:not(:disabled):hover{border-color:var(--gold)}
.codex{display:flex;flex-direction:column;gap:6px}
.urg{color:#ff8a7a;font-size:.85rem;margin-top:4px}.gr.ur{border-color:rgba(255,110,90,.55)!important}.gr em{display:block;font-style:normal;font-size:.7rem;color:#ff8a7a}
.ct{border:1px solid rgba(217,178,90,.14);border-radius:10px;padding:8px 10px;margin-top:8px}.ct.on{border-color:rgba(217,178,90,.35)}
details.tun{border-top:1px solid rgba(217,178,90,.12);padding:6px 0}details.tun>summary{cursor:pointer}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 0;font-size:.85rem}.trow span{color:var(--muted);word-break:break-word}.trow input{max-width:150px}
.tsub{margin:6px 0 2px 8px;padding-left:8px;border-left:1px solid rgba(217,178,90,.15)}
details.dl{border-top:1px solid rgba(217,178,90,.12);padding:8px 0}details.dl>summary{cursor:pointer;display:flex;flex-direction:column;gap:2px}.dlbody{margin-top:6px;font-size:.92rem;line-height:1.5}
textarea{width:100%;background:rgba(10,16,36,.8);color:var(--text);border:1px solid rgba(217,178,90,.25);border-radius:8px;padding:8px;font:inherit;box-sizing:border-box}
table.jt td,table.jt th{white-space:nowrap}table.jt td:first-child{white-space:normal}
details.dept{border:1px solid rgba(217,178,90,.12);border-radius:9px;padding:6px 10px;margin-top:6px}
details.dept>summary{display:flex;gap:8px;align-items:center;cursor:pointer;list-style:none} details.dept>summary::-webkit-details-marker{display:none}
details.dept>summary .small{margin-left:auto}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.25)}
.edlist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.edrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border:1px solid rgba(217,178,90,.12);border-radius:8px}
.edrow input{width:18px;height:18px}
.edname{cursor:pointer;min-width:0}
.settag{color:var(--gold);font-size:.85em}
details.cset>summary{list-style:none;cursor:pointer} details.cset>summary::-webkit-details-marker{display:none} details.cset{margin-top:12px}
.bundle{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:rgba(5,8,20,.35)}
select.bsel{width:auto;padding:5px 8px;font-size:.8rem}
.grades{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.gr{display:flex;flex-direction:column;align-items:center;border:1px solid rgba(217,178,90,.15);border-radius:6px;padding:3px 0;font-family:var(--mono)}
.gr b{font-size:.7rem;color:var(--muted)} .gr span{font-size:.9rem} .gr i{font-style:normal;font-size:.6rem;color:var(--dim)}
.gr.hi{border-color:rgba(232,163,60,.35)} .gr.hi b{color:var(--amber)}
.pill.warn{color:var(--amber);border-color:rgba(232,163,60,.5)}
details.desc{margin:-2px 0 8px} details.desc summary{cursor:pointer;list-style:none} details.desc summary::-webkit-details-marker{display:none}
.known-wrap>summary{list-style:none}.known-wrap>summary::-webkit-details-marker{display:none}
.known{display:flex;flex-direction:column;gap:4px}
.known details{border:1px solid rgba(217,178,90,.12);border-radius:8px;padding:6px 10px}
.known summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}
.known summary::-webkit-details-marker{display:none}
.known details[open] .small{margin-top:6px}
.proj .pl,.prog .pl,.mbox .pl{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);margin:5px 0}
.prog{margin-top:6px}
.bar.red>i{background:linear-gradient(90deg,#a3403a,var(--red))} .bar.amber>i{background:linear-gradient(90deg,#a8762b,var(--amber))}
.proj.off{border-color:rgba(226,100,92,.45);opacity:.85}
.cat{font:600 .64rem var(--mono);letter-spacing:.06em;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--gold2)}
.c-Class{color:#8fb7ff;border-color:rgba(143,183,255,.4)} .c-Item{color:#62c7b8;border-color:rgba(98,199,184,.4)} .c-System{color:#e3b955} .c-DevTool{color:#c49bff;border-color:rgba(196,155,255,.4)} .c-Perk{color:#f1d48c}
.icons{gap:10px;margin:6px 0;min-height:22px}
.ico{display:inline-flex;align-items:center;gap:3px;font:600 .8rem var(--mono)} .ico.bk{color:var(--muted);font-weight:400}
.scarab{width:18px;height:18px}
.qb .btn{padding:5px 8px}
h3.sect{margin:16px 2px 8px;color:var(--muted);font-family:var(--sans);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.picklist{display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow:auto}
.pick{text-align:left;background:rgba(5,8,20,.5);border:1px solid rgba(217,178,90,.15);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.pick.on{border-color:var(--gold);background:rgba(217,178,90,.1)}
.consts{width:100%;height:auto;display:block;max-height:300px}
.cyl{width:100%;max-width:300px;display:block;margin:8px auto}
.chamber{cursor:pointer;outline:none}.chamber:hover circle,.chamber:focus circle{stroke:#f1d48c;stroke-width:2.5}
.chamber.kp:not(.on){cursor:not-allowed}
.kpglow{animation:pulse 1.6s infinite}
.icob{background:none;border:0;color:inherit;cursor:pointer;padding:0}
.node{cursor:pointer;outline:none} .node:hover circle:nth-of-type(2),.node:focus circle:nth-of-type(2){filter:drop-shadow(0 0 3px #f1d48c)}
.zoom{margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.const1{width:100%;max-width:360px;height:auto;display:block;margin:0 auto 6px}
.proj.flash{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(241,212,140,.35)}
.panel.sky{background:radial-gradient(ellipse at 50% 30%,rgba(30,40,90,.6),rgba(8,12,30,.9))}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 10px;border:1px solid rgba(217,178,90,.12);border-radius:9px;cursor:pointer}
.crow:hover{border-color:var(--line2)}
@media(max-width:520px){.gcard{width:calc(50% - 5px);min-height:150px}}

/* ---------- foundation ---------- */
.track{display:flex;flex-direction:column;gap:4px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid rgba(217,178,90,.1)}
.step .k{font-family:var(--mono);color:var(--dim);text-align:center}
.step.un{border-color:var(--line2);background:rgba(217,178,90,.06)} .step.un .k{color:var(--gold2)}
.step.live{border-color:rgba(69,184,169,.5)} .step.live .k{color:var(--teal)}
.step .s{font-size:.76rem;color:var(--muted)}
.pill{font-size:.7rem;font-family:var(--mono);padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{color:var(--gold2);border-color:var(--line2)}
.linkbtn{background:none;border:0;color:var(--dim);font:inherit;font-size:.72rem;text-decoration:underline;cursor:pointer;padding:2px 0} .pill.live{color:var(--teal);border-color:rgba(69,184,169,.5)}

/* ---------- journal ---------- */
.jr{display:grid;grid-template-columns:70px 1fr;gap:2px 10px;font-size:.88rem}
.jr .tm{font-family:var(--mono);color:var(--dim);font-size:.8rem;padding-top:1px}
.jr .tx .c{font-size:.68rem;font-family:var(--mono);color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-right:5px}
.jday{font-family:var(--serif);color:var(--gold2);margin:12px 0 4px;grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:2px}
pre.md{white-space:pre-wrap;word-break:break-word;background:rgba(5,8,20,.75);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.5 var(--mono);max-height:60vh;overflow:auto;margin:0}

/* ---------- gauge ---------- */
.gauge{position:relative;height:16px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin:8px 0 4px}
.gauge i{position:absolute;top:0;bottom:0;left:0}
.gauge .safe{background:rgba(69,184,169,.22);border-right:2px solid var(--teal)}
.gauge .act{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.legend{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);font-family:var(--mono)}

/* ---------- modal / toast ---------- */
#modal:empty{display:none}
.mback{position:fixed;inset:0;z-index:50;background:rgba(3,5,12,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media(min-width:640px){.mback{align-items:center}}
.mbox{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:linear-gradient(180deg,#111938,#0a0f24);border:1px solid var(--line2);border-radius:16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.mbox .hd{position:sticky;top:-16px;background:#111938;margin:-16px -16px 10px;padding:14px 16px 8px;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
#toast div{background:#151d40;border:1px solid var(--line2);color:var(--text);padding:9px 14px;border-radius:10px;font-size:.88rem;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.note{border-left:3px solid var(--gold);padding:8px 10px;background:rgba(217,178,90,.06);border-radius:0 8px 8px 0;margin:6px 0}
.note.read{border-left-color:var(--dim);opacity:.75}
.note b{font-family:var(--serif);color:var(--gold2)}

footer{text-align:center;margin-top:26px;font-size:.8rem;color:var(--dim)}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
.hello{font-family:var(--mono);color:var(--gold2);letter-spacing:.04em}
.first{max-width:520px;margin:26px auto 0;text-align:center}
.first .seal{width:140px;height:90px;margin:4px auto 10px;display:block}
@media(max-width:520px){.grid{grid-template-columns:1fr}.clock .t{font-size:1.05rem}.brand b{font-size:.98rem}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <footer><span>The Guild Console · Akh Runtime · milestone 11</span> · <button id="creditsLink">Credits &amp; licenses</button></footer>
</div>

const DEFAULT_PLANES={"version":1,"source":"Timeline_Notes — The Wider Multiverse / The Planes","notes":"Plane catalog for The Guild Console. 'id' must be unique and never change once a plane is in the save. 'worlds' is optional (helps when installing Waystones). The Guild's own state for each plane (Registry, Standing, backlog, Waystones, Inn door) lives in the save, not here.","planes":[{"id":"alara","name":"Alara","description":"A plane once split into five separate shards, each defined overwhelmingly by a narrow slice of color-aligned magic before being violently rejoined. Patrons from here often still identify strongly with their shard of origin — the sharp intellect of Esper, the raw savagery of Jund, the ambition of Grixis, the growth of Naya, or the order of Bant.","earthCurrency":false,"worlds":[]},{"id":"amonkhet","name":"Amonkhet","description":"A sun-scorched desert plane built entirely around trials of endurance, honor, and the promise of a glorious afterlife. Patrons from here are disciplined, proud, and tend to treat even a simple meal as a small trial worth doing properly.","earthCurrency":false,"worlds":[]},{"id":"arcavios","name":"Arcavios","description":"A plane defined almost entirely by its rival magical colleges, where every rivalry doubles as a curriculum. Patrons from here debate methodology like it's a competitive sport and rarely miss a chance to one-up a classmate from another college.","earthCurrency":false,"worlds":[]},{"id":"belenon","name":"Belenon","description":"A plane of rolling hills and old feudal loyalties, where knighthood, chivalry, and inherited duty still carry real cultural weight. Patrons from here are formal, honor-bound, and take a broken promise more seriously than most.","earthCurrency":false,"worlds":[]},{"id":"dominaria","name":"Dominaria","description":"An old, well-worn plane that's seen more wars, empires, and magical catastrophes than most planes see centuries — history sits close to the surface everywhere you look. Patrons from here tend to be grounded, a little weathered, and rarely impressed by anything short of the truly ancient.","earthCurrency":false,"worlds":[]},{"id":"eldraine","name":"Eldraine","description":"A fairytale plane split into rival Courts, where every bargain has fine print and every forest path has a toll. Patrons from here are charming, a little sly, and take hospitality customs extremely seriously — for better or worse.","earthCurrency":false,"worlds":[]},{"id":"fiora","name":"Fiora","description":"A plane of masked nobility, court intrigue, and hidden knives — beautiful on the surface, treacherous a layer down. Patrons from here speak carefully, smile carefully, and rarely say the whole truth on the first pass.","earthCurrency":false,"worlds":[]},{"id":"ikoria","name":"Ikoria","description":"A plane where enormous, monstrous beasts roam and bond with the people who share the land with them — scale is simply part of daily life here. Patrons from here tend to travel with (or at least talk fondly about) something considerably larger than they are.","earthCurrency":false,"worlds":[]},{"id":"innistrad","name":"Innistrad","description":"A gothic, fog-choked plane where the dead don't always stay that way and the moon has an unpleasant habit of turning things feral. Patrons from here tend to be superstitious, quietly watchful, and deeply appreciative of a warm hearth and a locked door.","earthCurrency":false,"worlds":[]},{"id":"ixalan","name":"Ixalan","description":"A plane of sprawling jungle, sun-drowned ruins, and open ocean, fought over by rival seafaring and exploring peoples. Patrons from here are restless and adventure-hungry, prone to treasure-hunting stories that may or may not be exaggerated.","earthCurrency":false,"worlds":[]},{"id":"kaladesh","name":"Kaladesh","description":"A gleaming, invention-driven plane where clockwork and living energy are treated as the same discipline. Patrons from here are tinkerers and competitive inventors at heart, often arriving with some gadget mid-repair, and tend to appreciate dishes with visible craft or showmanship in the presentation.","earthCurrency":false,"worlds":[]},{"id":"kaldheim","name":"Kaldheim","description":"A frozen, myth-soaked plane of ten realms bound by a great cosmic tree, where gods walk among mortals and every feud eventually becomes a saga someone will sing about. Patrons from here are hardy, blunt, and take storytelling and oaths equally seriously.","earthCurrency":false,"worlds":[]},{"id":"kamigawa","name":"Kamigawa","description":"A plane where spirits, ancestral tradition, and living machinery sit in uneasy, glowing coexistence. Patrons from here are formal, precise, and carry a deep respect for craftsmanship, ritual, and honoring what came before.","earthCurrency":false,"worlds":[]},{"id":"kandoosh","name":"Kandoosh","description":"A humid, jungle-choked plane thick with ancient ruins and half-buried magic older than any of its current inhabitants understand. Patrons from here treat old ruins less like history and more like unfinished business.","earthCurrency":false,"worlds":[]},{"id":"lorwyn","name":"Lorwyn","description":"A bright, pastoral, fairytale-bright plane populated by whimsical, oversized folk — kithkin, boggarts, elves, and giants living in a world that looks gentle right up until it doesn't. Patrons from here are cheerful, superstitious about luck, and quick to invoke old folk customs.","earthCurrency":false,"worlds":[]},{"id":"mercadia","name":"Mercadia","description":"A plane of sun-baked pyramids and rigid class divide, historically ruled by a wealthy elite above a sprawling, laboring underclass. Patrons from here are shrewd bargainers, well aware that survival here has always come down to leverage.","earthCurrency":false,"worlds":[]},{"id":"mirrodin","name":"Mirrodin","description":"A plane forged almost entirely from metal, its skies, forests, and mountains all gleaming artificial surfaces rather than natural growth. Patrons from here treat the line between \"built\" and \"born\" as far blurrier than most planes do, and tend to have strong, specific opinions about craftsmanship.","earthCurrency":false,"worlds":[]},{"id":"moag","name":"Moag","description":"A plane of scattered islands and open water, historically shaped by rival naval powers and trade routes rather than any single ruling culture. Patrons from here are practical sailors at heart, comfortable making a home out of wherever the current puts them.","earthCurrency":false,"worlds":[]},{"id":"muraganda","name":"Muraganda","description":"A primeval plane of oversized wildlife and untouched wilderness, barely shaped by civilization at all. Patrons from here read as blunt, physical, and refreshingly uninterested in court politics or clever wordplay.","earthCurrency":false,"worlds":[]},{"id":"nauctis","name":"Nauctis","description":"A vast, sunlit-to-lightless ocean world with no true landmass to speak of — cities built into reefs and drowned ruins, currents doing the work roads do elsewhere. Patrons from here (merfolk, sharkfolk, squidfolk, seal-folk, and the rare human who's made peace with the depths) tend to be unbothered by pressure, literal or otherwise, and have a habit of describing danger the way most people describe weather.","earthCurrency":false,"worlds":[]},{"id":"new-capenna","name":"New Capenna","description":"A glittering, art-deco city-plane run by five rival crime families, each built around their own demonic patron and their own idea of glamour. Patrons from here dress like they're always about to close a deal, and usually are.","earthCurrency":false,"worlds":[]},{"id":"new-phyrexia","name":"New Phyrexia","description":"A corrupted, mechanically-infused plane where flesh and metal have been fused together by force rather than choice, its history one of invasion and forced conversion. Patrons from here (survivors more than natives, usually) carry a hard-won wariness and don't trust anything that looks too perfect.","earthCurrency":false,"worlds":[]},{"id":"pyrulea","name":"Pyrulea","description":"A war-scarred plane of rival nations and constant border conflict, its people shaped by generations of skirmishing over the same disputed ground. Patrons from here are guarded, quick to size up an exit, and slow to fully trust a peaceful room.","earthCurrency":false,"worlds":[]},{"id":"rath","name":"Rath","description":"A grim, artificial plane once maintained purely as a staging ground for invasion, its landscape unnervingly still and its native life largely twisted or replaced. Patrons from here (rare, and usually survivors of something) tend to be quiet about where they're really from.","earthCurrency":false,"worlds":[]},{"id":"ravnica","name":"Ravnica","description":"A world that is, in its entirety, one endless city — carved up between ten rival guilds, each with its own philosophy of order, ambition, or artistry. Patrons from here are opinionated about structure and loyalty, and rarely shy about which guild's worldview they think is correct.","earthCurrency":false,"worlds":[]},{"id":"regatha","name":"Regatha","description":"A harsh, volcanic plane of ash-choked mountains and fire cults, home to disciplined monastic orders who train amid the heat rather than despite it. Patrons from here are stoic, ascetic, and unbothered by conditions that would flatten most travelers.","earthCurrency":false,"worlds":[]},{"id":"segovia","name":"Segovia","description":"A plane shaped heavily by a single ancient, powerful bloodline's influence, its culture built around old debts, favors, and long memories. Patrons from here treat a spoken promise as something closer to law.","earthCurrency":false,"worlds":[]},{"id":"serra-s-realm","name":"Serra's Realm","description":"A plane of pristine, almost impossibly ordered beauty, once shaped directly by a single guiding hand before falling into slow decay. Patrons from here carry a wistful, faded elegance, like nobility from a kingdom that's quietly stopped mattering.","earthCurrency":false,"worlds":[]},{"id":"shadowmoor","name":"Shadowmoor","description":"The same plane as Lorwyn, but swung dark — shadow-drenched, twisted, and dangerous, where the once-whimsical folk have all turned some grim mirror version of themselves. Patrons from here (when they're not simply Lorwyn folk mid-cycle) read as moodier, more guarded, and quick to read menace into ordinary things.","earthCurrency":false,"worlds":[]},{"id":"shandalar","name":"Shandalar","description":"A plane thick with wandering, self-taught mages and open magical frontier — less unified kingdom, more scattered network of rival practitioners testing their luck. Patrons from here are curious, a little reckless, and always angling to learn one more trick.","earthCurrency":false,"worlds":[]},{"id":"earth","name":"Sol Continuum","description":"A single vast reality knit together by old star-empires and one small, stubborn blue world at its center. Encompasses Earth-616 and its mutant nations, the war-blooded Shi'ar Empire, the ancient and militant Kree, the shapeshifting Skrull dominion, and a dozen smaller powers besides. Home plane to this setting's mutant characters.","earthCurrency":true,"worlds":["Earth","Mars","Chandilar"],"home":true,"notes":"Home plane. Earth's Hub Waystone is not on Krakoa (the Quiet Council wouldn't allow a public crossroads there)."},{"id":"theros","name":"Theros","description":"A plane where the gods are real, present, and keeping score — mortal fates bound up in oaths, prophecy, and the occasional trip to the underworld. Patrons from here carry themselves with a certain theatrical gravity, like they're always narrating their own myth in progress.","earthCurrency":false,"worlds":[]},{"id":"thunder-junction","name":"Thunder Junction","description":"A sun-scorched, outlaw-riddled frontier plane of dust, gold, and shifting loyalties, where fortune favors whoever's fastest to the draw. Patrons from here talk in a slow drawl, trust a handshake more than a contract, and are never quite as unarmed as they look.","earthCurrency":false,"worlds":[]},{"id":"ulgrotha","name":"Ulgrotha","description":"A grim, corrupted plane slowly consumed by an unraveling magical blight, its people used to scraping out survival in the shadow of ongoing ruin. Patrons from here are wary, resourceful, and don't trust good news until it's already happened.","earthCurrency":false,"worlds":[]},{"id":"vryn","name":"Vryn","description":"A plane where knowledge and memory themselves are treated as a kind of currency and hazard both, its people unusually careful about what they choose to know. Patrons from here ask fewer questions than you'd expect, and answer even fewer.","earthCurrency":false,"worlds":[]},{"id":"wildfire","name":"Wildfire","description":"A plane shaped by wandering nomadic tribes and open, unclaimed frontier, its borders shifting as often as its weather. Patrons from here are self-reliant and wary of anywhere that claims to be permanently \"settled.\"","earthCurrency":false,"worlds":[]},{"id":"xerex","name":"Xerex","description":"A plane locked in perpetual twilight, its people adapted to dim light and quiet movement rather than open confrontation. Patrons from here are soft-spoken, watchful, and difficult to read in a well-lit room.","earthCurrency":false,"worlds":[]},{"id":"zendikar","name":"Zendikar","description":"A wild, unstable plane where the land itself is alive, hostile, and prone to rearranging without warning. Patrons from here are hardened Delvers by necessity, pragmatic, and unfazed by most things the Long Road can throw at them.","earthCurrency":false,"worlds":[]},{"id":"zhalfir","name":"Zhalfir","description":"A lush, storied realm steeped in old magic and older bloodlines, where time itself bends a little more easily than it should. Patrons from here carry themselves with the quiet confidence of a people who've watched empires rise and fold and are in no hurry about much of anything.","earthCurrency":false,"worlds":[]}]};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtN=(n,d=0)=>Number(n||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtCr=n=>{const v=Math.round((n||0)*100)/100;return fmtN(v,Number.isInteger(v)?0:2)+" Cr"};
const pct=n=>fmtN(n*100,Math.abs(n*100)%1?1:0)+"%";
function toast(msg,ms=2600){const d=document.createElement("div");d.textContent=msg;$("#toast").appendChild(d);setTimeout(()=>d.remove(),ms)}
function download(name,text,type="application/json"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied")}catch(_){toast("Couldn't copy — use Download")}ta.remove()}}

/* ---------------- dates and time ---------------- */
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const parseISO=iso=>{const [y,m,d]=iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const isoOf=dt=>dt.toISOString().slice(0,10);
const addDays=(iso,n)=>{const d=parseISO(iso);d.setUTCDate(d.getUTCDate()+n);return isoOf(d)};
const fmtDate=iso=>parseISO(iso).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
const fmtDateLong=iso=>parseISO(iso).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric",timeZone:"UTC"});
const monthKey=iso=>iso.slice(0,7);
const fmtMonth=key=>{const [y,m]=key.split("-").map(Number);return MONTHS[m-1]+" "+y};
function fmtTime(min){min=Math.round(min);const day=Math.floor(min/1440);let m=min%1440;const h=Math.floor(m/60),mm=m%60;const ap=h<12?"AM":"PM";const h12=h%12||12;return `${h12}:${String(mm).padStart(2,"0")} ${ap}`+(day>0?` (+${day}d)`:"")}
function fmtDur(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h&&m?`${h} hr ${m} min`:h?`${h} hr`+(h>1?"s":""):`${m} min`}

/* ---------------- shared helpers (Build Spec §1) ---------------- */
/** Days in the month of an ISO date. Monthly rates are always divided by this. */
function daysInMonth(iso){const d=parseISO(iso);return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()}
function hashStr(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0)*4294967296+(h1>>>0)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
/** Seeded random stream for the current date and a roll label. Same save + date + label = same numbers, every time. */
function rng(label,date){return mulberry32(hashStr(`${S.seed}|${date||S.date}|${label}`)%4294967296)}
/** Bucket / percent-overflow roll: whole part guaranteed, fractional remainder rolled. */
function rollCount(expected,r){if(!(expected>0))return 0;const w=Math.floor(expected),f=expected-w;return w+((r||Math.random)()<f?1:0)}
/** Pick one key from a weight table; zero weights drop out and the rest renormalize. */
function weightedPick(weights,r){const ks=Object.keys(weights).filter(k=>weights[k]>0);const tot=ks.reduce((s,k)=>s+weights[k],0);if(!tot)return null;let x=(r||Math.random)()*tot;for(const k of ks){x-=weights[k];if(x<0)return k}return ks[ks.length-1]}

/** Fill in anything a newer build added, without touching what's already there. */
function migrate(s){
  const base=freshState(s.date||s.startDate||"2026-08-11");
  const fill=(dst,src)=>{for(const k in src){if(!(k in dst))dst[k]=JSON.parse(JSON.stringify(src[k]));else if(src[k]&&typeof src[k]==="object"&&!Array.isArray(src[k])&&dst[k]&&typeof dst[k]==="object"&&!Array.isArray(dst[k]))fill(dst[k],src[k])}};
  const keepSeed=s.seed;fill(s,base);if(keepSeed)s.seed=keepSeed;
  s.meta.schema=1;s.meta.milestone=BUILD.milestone;
  s.runtime.maxCapacity=maxCapacityFor(s,s.runtime.moarRank);
  if(typeof s.housing.waitlist==="number")s.housing.waitlist={apt:0,home:s.housing.waitlist};
  s.money.monthBy=s.money.monthBy||{};s.money.monthExpBy=s.money.monthExpBy||{};
  for(const pl of s.planes||[]){if(pl.id==="earth"&&pl.name==="Earth"){pl.name="Sol Continuum";pl.catalogId="earth"}}
  if(!Array.isArray(s.bundles))s.bundles=[];if(!s.jeff)s.jeff={balance:0,plushEarned:0};
  if(s.settings?.quests)delete s.settings.quests.expiry;
  for(const pl of s.planes||[]){if(!pl.batches){pl.batches={};for(const g of GRADES){const b=pl.backlog?.[g]||{paid:0,waived:0};pl.batches[g]=b.paid+b.waived?[{d:s.date,paid:b.paid,waived:b.waived}]:[]}}}
  if(Array.isArray(s.projects))for(const p of s.projects){if(p.job===undefined)p.job=null;if(p.hoursLogged===undefined)p.hoursLogged=0;if(!p.releases)p.releases=[]}
  for(const id of s.foundation.unlocked)if(!s.codex[id])s.codex[id]={expertiseHours:0,discovered:s.date,how:"granted",drawn:0,history:[]};
  return s;
}

const ES=()=>S.settings.emerson;
/** XP to go from `lvl` to the next level: 100 × 1.25^(level − 1). */
const xpToNext=lvl=>Math.round(ES().xpBase*Math.pow(ES().xpGrowth,lvl-1));
/** Runtime efficiency from Thought: 55% + 5% per point, capped at 95%. */
const effAt=thought=>Math.min(ES().effCap,ES().effBase+ES().effPerThought*thought);
const efficiency=()=>effAt(S.emerson.stats.thought);
/** Maximum capacity: 15 for the initial Runtime, then the MOAR SERVERS!!! ranks. */
function maxCapacityFor(s,rank){const c=s.settings.capacity;return rank>0?c.ranks[Math.min(rank,c.ranks.length)-1]:c.base}
/** Safe capacity = maximum × efficiency, rounded down. */
const safeCapacity=()=>Math.floor(S.runtime.maxCapacity*efficiency());
/** Authority needed to start the next MOAR SERVERS!!! rank, or null past the last rank. */
const nextMoarGate=()=>{const c=S.settings.capacity,r=S.runtime.moarRank;return r<c.ranks.length?{rank:r+1,max:c.ranks[r],authority:c.authority[r]}:null};
const latentBugCut=()=>Math.min(.6,.05*S.emerson.stats.thought);
const purgePct=()=>.10+.05*S.emerson.stats.flesh;
const patchAmt=()=>5+5*S.emerson.stats.thought;
const DAKKA_FLESH=[4,5,6,7,8];
const ROMAN=["","I","II","III","IV","V","VI","VII","VIII","IX","X"];

/** Grant Concept XP. Each level gives 1 stat point and 1 pack; excess XP carries over. Returns levels gained. */
function gainXP(amount,reason,cat="System"){
  amount=Math.round(amount);if(!(amount>0))return 0;
  const e=S.emerson;e.xp+=amount;e.totalXp=(e.totalXp||0)+amount;
  log(`+${fmtN(amount)} XP${reason?" — "+reason:""}`,cat);
  let gained=0;
  while(e.xp>=xpToNext(e.level)){
    e.xp-=xpToNext(e.level);e.level++;gained++;
    e.unspentPoints+=ES().pointsPerLevel;
    for(let i=0;i<ES().packsPerLevel;i++)S.packs.push({category:null,source:`Level ${e.level} pack`});
    e.levelHistory.push({level:e.level,date:S.date,time:S.time});
    log(`Concept Level ${e.level}! +1 stat point, +1 pack.`,"System");
    notify(`Concept Level ${e.level}`,`+1 stat point to spend on the Emerson tab and +1 pack (her choice of category). Next level at ${fmtN(xpToNext(e.level))} XP.`);
  }
  if(gained&&typeof checkFoundation==="function")checkFoundation();
  if(gained)UI.levelUp=(UI.levelUp||0)+gained;
  return gained;
}
const STATINFO={
  authority:{name:"Authority",gov:"Conceptual scale: maximum capacity, system complexity, multi-planar reach."},
  thought:{name:"Thought",gov:"Programming and Runtime efficiency: how much of her Authority she can actually use."},
  flesh:{name:"Flesh",gov:"Body and weregriffon physiology: strength, endurance, fighting during incursions."},
};
/** Spend one unspent point on a stat. Permanent. */
function spendPoint(stat){
  const e=S.emerson;if(e.unspentPoints<1||!STATINFO[stat])return false;
  const before=stat==="thought"?efficiency():null;
  e.stats[stat]++;e.unspentPoints--;
  let extra="";
  if(stat==="thought"){const after=efficiency();extra=after>before?` Efficiency ${pct(before)} → ${pct(after)}; safe capacity now ${safeCapacity()}.`:" Efficiency is already at its 95% cap."}
  if(stat==="authority"){const g=nextMoarGate();if(g&&e.stats.authority>=g.authority)extra=` Meets the Authority gate for MOAR SERVERS!!! ${ROMAN[g.rank]}.`}
  if(stat==="flesh"){const r=DAKKA_FLESH.indexOf(e.stats.flesh);if(r>=0)extra=` Meets the Flesh gate for MOAR DAKKA ${ROMAN[r+1]}.`}
  log(`${STATINFO[stat].name} ${e.stats[stat]-1} → ${e.stats[stat]}.${extra}`,"System");
  return true;
}

/** A card's project has been deployed (live, or offline at 0% Integrity). */
const isDeployed=id=>S.projects.some(p=>p.cardId===id&&(p.status==="live"||p.status==="offline"));
const ranksBuilt=id=>S.projects.filter(p=>p.cardId===id&&(p.status==="live"||p.status==="offline")).length;
function maxRankOf(c){if(c.id==="moar-servers")return S.settings.capacity.ranks.length;return c.maxRank||(c.repeatable?Infinity:1)}
/** Card pool rules: core cards never drop; class tiers need their parents deployed; feature cards need their core project live. */
/** A class parent that's Staged in a bundle counts as available for the cards and projects that depend on it. */
const isClassCard=c=>c&&c.category==="Class";
const stagedIn=(id,bundleId)=>S.projects.some(p=>p.cardId===id&&p.status==="staged"&&(!bundleId||p.bundleId===bundleId));
function eligible(c){
  if(c.core||c.unnamed||c.retired)return false;
  for(const n of c.needs||[]){const parent=getCard(n);if(parent&&(parent.core||parent.pack==="System")){if(!isLive(n))return false}else if(!isDeployed(n)&&!(isClassCard(parent)&&stagedIn(n)))return false}
  if(c.repeatable&&ranksBuilt(c.id)>=maxRankOf(c))return false;
  return true;
}
const poolFor=(cat,set)=>allCards().filter(c=>c.pack===cat&&eligible(c)&&(!set||set==="any"||cardSet(c)===set));

/** Base coding hours: rarity base × category, × the rank being built for repeatable perks. Dev Tools set their own. */
function baseHours(c,rank=1){
  if(!c)return 0;
  if(c.category==="DevTool")return c.hours??S.settings.dev.spellHours[c.rarity];
  if(c.id==="remastered")return (c.effect?.hoursPerRank||24)*rank;
  const b=S.settings.dev.rarityBase[c.rarity]*(S.settings.dev.catMult[c.category]||1);
  return c.repeatable?b*rank:b;
}
function devToolHours(src){
  switch(src.kind){
    case "ygo-level":case "ygo-rank":case "ygo-link":return Math.max(1,+src.n||1);
    case "mtg":return (+src.n||0)<=0?.5:+src.n;
    case "mtg-land":case "zero":return .5;
    default:return S.settings.dev.spellHours[src.rarity||"C"];
  }
}

/* ---- pack opening ---- */
/** Opens one pack: 2–4 cards from the chosen category, with rarity odds, the pity rule and MOAR SERVERS!!! protection. */
function openPack(index,cat,set){
  const pk=S.packs[index];if(!pk)return null;
  const can=canOpen(cat,set);if(!can.ok){toast(can.why,4000);return null}
  const st=CS(),r=rng("pack#"+(S.packsOpened||0));
  const pool=poolFor(cat,set);
  const n=st.minCards+Math.floor(r()*(st.maxCards-st.minCards+1));
  const draws=[];
  const drawOne=(forceRar)=>{
    let rar=forceRar;
    if(!rar){const w={};for(const k of RAR_ORDER)w[k]=pool.some(c=>c.rarity===k)?st.rarityWeights[k]:0;rar=weightedPick(w,r)}
    const have=pool.filter(c=>c.rarity===rar);
    if(!have.length)return null;
    return {id:have[Math.floor(r()*have.length)].id,rarity:rar};
  };
  for(let i=0;i<n;i++){const d=drawOne();if(d)draws.push(d)}
  const high=()=>draws.some(d=>d.rarity==="R"||d.rarity==="M");
  // Pity: at least one Rare every 10 packs of the same category.
  let pity=false;
  if(!high()&&(S.pityCounters[cat]||0)>=st.pityEvery-1&&pool.some(c=>c.rarity==="R")){const d=drawOne("R");if(d){draws[draws.length-1]=d;pity=true}}
  // MOAR SERVERS!!! protection at 90%+ of safe capacity.
  let moar=false;
  if(cat==="Perk"&&safeCapacity()>0&&usedCapacity()>=st.moarAt*safeCapacity()&&pool.some(c=>c.id==="moar-servers")&&!draws.some(d=>d.id==="moar-servers")){draws[0]={id:"moar-servers",rarity:getCard("moar-servers").rarity};moar=true}
  S.pityCounters[cat]=high()?0:(S.pityCounters[cat]||0)+1;
  // Add everything to the hand.
  const out=[];
  draws.forEach((d,i)=>{
    const id=d.id;
    addCard(id);const isNew=discover(id,"drawn");S.codex[id].drawn++;
    out.push({id,isNew});
  });
  S.packs.splice(index,1);S.packsOpened=(S.packsOpened||0)+1;
  const real=spend(st.openMinutes,null);
  const names=out.map(o=>`${getCard(o.id).name} (${getCard(o.id).rarity})`).join(", ");
  log(`Opened a ${PACKNAME[cat]} pack${set&&set!=="any"?` (${setName(set)})`:""} (${pk.source}, ${fmtDur(real)}): ${names}.${pity?" Pity Rare.":""}${moar?" MOAR SERVERS!!! protection.":""}`,"Cards");
  return {cat,set,source:pk.source,cards:out,pity,moar};
}

/** Every reduction that applies to a card's coding time, capped at 60%. */
function reductionsFor(card,tags=[]){

const VECTORS={member:"a member's HUD connection",anchor:"a physical anchor (Waystone, GIT door or safe zone)",emerson:"Emerson herself (a psychic or conceptual attack)"};
const liveProjects=()=>S.projects.filter(p=>p.status==="live");
const projById=id=>S.projects.find(p=>p.id===id);
/** Which projects are connected [default]: a card's prerequisites and dependents; core projects link to Registration, the hub; anything with no prerequisite links to Registration too. */
function connectedOf(p){
  const out=new Set(),card=getCard(p.cardId)||{},reg=S.projects.find(x=>x.cardId==="adventurer-registration");
  const deployedP=x=>x.status==="live"||x.status==="offline";
  for(const n of card.needs||[])for(const q of S.projects)if(q.cardId===n&&deployedP(q))out.add(q);
  for(const q of S.projects)if(q!==p&&deployedP(q)&&(getCard(q.cardId)?.needs||[]).includes(p.cardId))out.add(q);
  if(reg&&p!==reg&&deployedP(reg)&&!(card.needs||[]).length)out.add(reg);
  if(p===reg)for(const q of S.projects)if(q!==p&&deployedP(q)&&!(getCard(q.cardId)?.needs||[]).length)out.add(q);
  return [...out];
}
const detectThreshold=()=>Math.max(SEC().detectFloor,(S.runtime.antivirus?SEC().detectAntivirus:SEC().detect)-SEC().earlyPerRank*S.runtime.earlyDetectRank);
const vaccinated=p=>p.vaccineUntil&&p.vaccineUntil>=S.date;

const connectedPlanes=()=>S.planes.filter(p=>p.registryActive).length;
const attackChance=()=>Math.min(SEC().attackCap,SEC().attackBase+SEC().attackPerPlane*connectedPlanes());

function plantVirus(p,severity,vector,type,load,detected){

/** End Day step 1, overnight security. Returns report lines. */
function runSecurity(){
  const L=[],sc=SEC();
  // 1. Malfunction roll
  const mc=malfunctionChance();
  if(mc>0&&rng("sec:malf")()<mc){const bugged=liveProjects().filter(p=>p.bugsHidden+p.bugsKnown>0);if(bugged.length){const p=bugged[Math.floor(rng("sec:malf-pick")()*bugged.length)];p.integrity=Math.max(0,p.integrity-sc.malfDamage);L.push(`Malfunction in ${p.name}: −${sc.malfDamage} Integrity (${Math.round(p.integrity)}/${p.maxIntegrity}). Chance was ${pct(mc)}.`)}}
  // 2. Virus growth
  for(const p of S.projects){if(!p.virus||p.status==="coding"||p.status==="testing")continue;if(p.breakpoint){L.push(`Breakpoint held the Virus in ${p.name} overnight.`);continue}
    p.virus.load=Math.min(100,p.virus.load+sc.growth[p.virus.severity]);const dmg=p.virus.load/sc.integrityDiv;p.integrity=Math.max(0,p.integrity-dmg);
    if(p.virus.detected)L.push(`Virus in ${p.name} grew to ${Math.round(p.virus.load)}%: −${+dmg.toFixed(1)} Integrity.`)}
  // 3. Spread
  for(const p of [...S.projects]){if(!p.virus||p.quarantined||p.breakpoint||p.virus.load<sc.spreadAt)continue;
    const r=rng("sec:spread:"+p.id);if(r()<sc.spreadChance){const targets=connectedOf(p).filter(q=>q.status==="live"&&!q.virus&&!vaccinated(q));if(targets.length){const q=targets[Math.floor(r()*targets.length)];plantVirus(q,p.virus.severity,p.virus.vector,p.virus.type,sc.seedLoad,false);if(p.virus.detected)L.push(`The Virus in ${p.name} spread along a connection.`)}}}
  // 4. Detection

  for(const p of S.projects)if(p.virus&&!p.virus.detected&&p.virus.load>=th){detectVirus(p);L.push(`Virus detected in ${p.name}: ${p.virus.severity} ${p.virus.type} at ${Math.round(p.virus.load)}% (threshold ${th}%). Incursion opened at ${sc.startThreat[p.virus.severity]}% threat.${p.quarantined&&S.runtime.antivirus?" Antivirus quarantined it.":""}`)}
  // 5. New attack
  const ac=attackChance(),ra=rng("sec:attack");
  if(ra()<ac){const targets=liveProjects().filter(p=>!p.virus&&!vaccinated(p)&&!(p.rootFixedUntil&&p.rootFixedUntil>=S.date));
    if(targets.length){const sev=weightedPick(sc.sevWeights,ra);const anchorsOk=isLive("waystones")||isLive("guild-inn-and-tavern")||isLive("safe-zones");
      const vec=weightedPick({member:sc.vectorWeights.member,anchor:anchorsOk?sc.vectorWeights.anchor:0,emerson:sc.vectorWeights.emerson},ra);
      const type=Object.keys(VTYPES)[Math.floor(ra()*5)];const p=targets[Math.floor(ra()*targets.length)];plantVirus(p,sev,vec,type,sc.seedLoad,false);
      S.flags.attacks=(S.flags.attacks||0)+1}}
  // 6. Bug discovery
  let found=0;for(const p of S.projects){if(!p.bugsHidden)continue;const r=rng("sec:bugs:"+p.id);let n=0;for(let i=0;i<p.bugsHidden;i++)if(r()<sc.discovery)n++;if(n){p.bugsHidden-=n;p.bugsKnown+=n;found+=n;L.push(`${n} Bug${n>1?"s":""} reported in ${p.name} (${p.bugsKnown} known).`)}}
  // 7. Bug Swarms
  for(const p of S.projects)if(p.status==="live"&&p.bugsKnown>=sc.swarmAt){const t=Math.min(100,sc.swarmPerBug*p.bugsKnown);if(openIncursion(p,"swarm",sevOfThreat(t),t)){L.push(`A scarab swarm manifested in ${p.name}: ${p.bugsKnown} Bugs, ${t}% threat.`);notify(`Bug Swarm: ${p.name}`,`${p.bugsKnown} known Bugs became a swarm incursion at ${t}% threat.`)}}

  recomputeRuntime();

  if(!S.runtime.kernelPanicCharged){S.runtime.kernelPanicCharged=true;L.push("Kernel Panic recharged.")}
  for(const p of S.projects)p.breakpoint=false;
  return L;
}

const SUB=()=>S.settings.subs;

const daysSince=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);
const HYPE={cosmetic:{name:"Cosmetic drop",sign:1.1,churn:.95,days:7},content:{name:"Content update",sign:1.25,churn:.9,days:14},event:{name:"Event",sign:1.5,churn:.8},expansion:{name:"Expansion",sign:2.5,churn:.6,days:30,fade:30},devlog:{name:"Dev Log",sign:1.05,churn:.97,days:7},campaign:{name:"Free-access campaign",sign:1,churn:1,resub:3}};
/** Today's hype: the single highest signup multiplier among active releases (and its churn), never multiplied together. */
function hypeNow(date=S.date){
  let best={name:null,sign:1,churn:1,resub:1};
  const consider=(type,start,days,bonus)=>{const h=HYPE[type];if(!h)return;const d=daysSince(start,date);if(d<0)return;
    let sign=h.sign+(bonus||0),churn=h.churn,len=days??h.days;
    if(type==="expansion"&&d>=len){if(d>=len+h.fade)return;const f=1-(d-len)/h.fade;sign=1+(sign-1)*f;churn=1-(1-churn)*f}
    else if(d>=len)return;
    if(type==="campaign"){if(3>best.resub)best={...best,resub:h.resub,campaign:true};return}
    if(sign>best.sign)best={name:h.name+(type==="expansion"&&d>=len?" (fading)":""),sign,churn,resub:best.resub,until:addDays(start,len+(type==="expansion"&&d>=len?h.fade:0))}};
  for(const r of S.releases)consider(r.type,r.date,r.type==="event"||r.type==="campaign"?r.days:null,r.preview?.1:0);
  for(const l of S.devLog||[])consider("devlog",l.date,null,0);
  return best;
}
/** Content drought: churn +0.1 for every 30 days without a content update, event or expansion (cap ×1.5); a Dev Log in the last 30 days halves the buildup. */
function droughtNow(date=S.date){
  const d=Math.max(0,daysSince(S.lastContentDate||S.startDate,date));
  const recentLog=(S.devLog||[]).some(l=>{const x=daysSince(l.date,date);return x>=0&&x<30});
  const per=SUB().droughtPer*(recentLog?SUB().devLogDroughtFactor:1);

const signupMultPerks=()=>Math.pow(1.1,liveRanks("word-gets-around"));

/** Take n people out of the tier groups, proportionally, from active+grinders. Returns {tier:count}. */
function takeProportional(n,groups){
  const out={};let left=n;const tot=TIERS.reduce((s,t)=>s+groups.reduce((a,g)=>a+(g[t]||0),0),0);if(!tot)return out;
  TIERS.forEach((t,i)=>{for(const g of groups){const share=i===TIERS.length-1&&g===groups[groups.length-1]?left:Math.min(left,Math.round(n*(g[t]||0)/tot));const take=Math.min(share,g[t]||0,left);if(take>0){g[t]-=take;out[t]=(out[t]||0)+take;left-=take}}});
  for(const t of TIERS)for(const g of groups){if(left<=0)break;const take=Math.min(left,g[t]||0);if(take){g[t]-=take;out[t]=(out[t]||0)+take;left-=take}}
  return out;
}
/** End Day step 2. Returns report lines. */
function runSubscribers(){
  if(!isLive("membership-and-subscriptions"))return [];
  const L=[],sb=S.subs,st=SUB(),days=daysInMonth(S.date),r=rng("subs"),hy=hypeNow(),dr=droughtNow();
  // 1. Trials that reach 30 days
  let conv=0,lap=0,grind=0;
  sb.trials=sb.trials.filter(tr=>{if(daysSince(tr.startDate,S.date)<st.trialDays)return true;
    for(let i=0;i<tr.count;i++){if(r()<st.trialConvert){conv++;if(r()<st.grinderShare){sb.grinders.Adventurer++;grind++}else sb.active.Adventurer++}else{lap++;sb.lapsed.Adventurer++}}return false});
  if(conv||lap)L.push(`Trials ended: ${conv} converted to Active${grind?` (${grind} grinder${grind>1?"s":""})`:""}, ${lap} lapsed.`);
  // 2. Churn
  const act=activeCount();
  const churnN=Math.min(act,rollCount(act*st.churn/days*hy.churn*dr.mult,r));
  if(churnN){const gone=takeProportional(churnN,[sb.active,sb.grinders]);for(const t in gone)sb.lapsed[t]+=gone[t];L.push(`${churnN} churned to Lapsed.`);if(typeof housingOnChurn==="function")housingOnChurn(churnN,r)}
  // 3. Resubs (need safe capacity)
  const lapsedN=sumTiers(sb.lapsed);let resubN=Math.min(lapsedN,rollCount(lapsedN*st.resub/days*hy.sign*hy.resub,r));
  resubN=Math.min(resubN,freeCapacity());
  if(resubN){const back=takeProportional(resubN,[sb.lapsed]);for(const t in back)sb.active[t]+=back[t];L.push(`${resubN} resubscribed.`)}
  // 4. Waitlist first, then signups
  const giveUp=rollCount(sb.waitlist*st.waitGiveUp/days,r);if(giveUp){sb.waitlist-=giveUp;L.push(`${giveUp} gave up waiting.`)}
  const fromWait=Math.min(sb.waitlist,freeCapacity());if(fromWait){sb.waitlist-=fromWait;sb.trials.push({startDate:S.date,count:fromWait,from:"waitlist"});L.push(`${fromWait} activated from the Waitlist (trials).`)}
  if(organicOn()){
    const planes=S.planes.filter(p=>p.registryActive).length;
    const signups=rollCount((activeCount()*st.signupPct+st.perPlane*planes)/days*hy.sign*signupMultPerks()*merchSignupMult(),r);
    if(signups){const cap=freeCapacity(),now=Math.min(signups,cap),wait=signups-now;if(now)sb.trials.push({startDate:S.date,count:now});sb.waitlist+=wait;
      L.push(`${signups} signup${signups>1?"s":""}: ${now} started trials${wait?`, ${wait} joined the Waitlist (no safe capacity)`:""}.`);
      if(wait&&!S.flags.waitlistWarned){S.flags.waitlistWarned=true;notify("The Waitlist is growing","Signups beyond safe capacity wait in line. Deploy MOAR SERVERS!!! or raise Thought to let them in.")}}
  }
  // 5. Tier promotions (monthly 8 / 4 / 2 / 2%, rolled daily; grinders 3×)
  const promo=[];for(let i=0;i<TIERS.length-1;i++){for(const [g,m] of [[sb.active,1],[sb.grinders,st.grinderMult]]){const n=Math.min(g[TIERS[i]],rollCount(g[TIERS[i]]*st.promo[i]*m/days,r));if(n){g[TIERS[i]]-=n;g[TIERS[i+1]]+=n;promo.push(`${n} → ${TIERS[i+1]}`)}}}
  if(promo.length)L.push(`Tier promotions: ${promo.join(", ")}.`);
  // 6. Capacity milestones
  const a=activeCount();st.milestones.forEach((m,i)=>{if(a>=m&&!sb.everReached.includes(m)){sb.everReached.push(m);S.packs.push({category:null,source:`Milestone: ${fmtN(m)} active`});L.push(`Milestone: ${fmtN(m)} active Adventurers! +1 pack.`);notify(`${fmtN(m)} active Adventurers`,`A capacity milestone: +${fmtN(st.milestoneXp[i])} XP and a milestone pack.`);gainXP(st.milestoneXp[i],`${fmtN(m)} active Adventurers`,"Subscribers")}});
  if(sb.history){sb.history.push({d:S.date,a:activeCount(),t:trialCount(),l:sumTiers(sb.lapsed),w:sb.waitlist});if(sb.history.length>400)sb.history.shift()}
  return L;
}
/** Story control: add or remove members by hand (invites, sponsored groups, scenes). */
function adjustMembers(group,tier,n){
  const sb=S.subs;n=Math.round(n);if(!n)return 0;
  if(n>0&&(group==="active"||group==="trial")){const cap=freeCapacity();if(n>cap){toast(`Only ${cap} free safe capacity. The rest go to the Waitlist.`,3500);sb.waitlist+=n-cap;n=cap}}
  if(group==="active")sb.active[tier]=Math.max(0,sb.active[tier]+n);
  else if(group==="trial"){if(n>0)sb.trials.push({startDate:S.date,count:n});else{let k=-n;for(const tr of sb.trials){const x=Math.min(k,tr.count);tr.count-=x;k-=x}sb.trials=sb.trials.filter(t=>t.count>0)}}
  else if(group==="lapsed")sb.lapsed[tier]=Math.max(0,sb.lapsed[tier]+n);
  else if(group==="waitlist")sb.waitlist=Math.max(0,sb.waitlist+n);

}

/* ================================================================
   PLANES AND QUESTS (Build Spec §7 step 3, §16; dump doc Quest Grades, Guild Standing)

const QS=()=>S.settings.quests;
const DEMANDS=["low","baseline","high","surge"];
const DEMAND_NAME={low:"Low",baseline:"Baseline",high:"High",surge:"Dungeon Surge"};
const STANDINGS=[["Newcomer",1],["Recognized",5],["Trusted",10],["Renowned",15],["Legendary",21]];
const standingIdx=lv=>{let i=0;STANDINGS.forEach(([n,m],k)=>{if(lv>=m)i=k});return i};
const standingName=lv=>STANDINGS[standingIdx(lv)][0];
const planeMult=lv=>Math.min(QS().levelMultCap,1+QS().levelMultPer*(lv-1));
const regPlanes=()=>S.planes.filter(p=>p.registryActive);
/** Grades each tier's Adventurers can clear (from the tier mix). */
const TIER_GRADES={Adventurer:["F","E"],Veteran:["D"],Champion:["C","B"],Mythic:["A","S"],Ascendant:["SS","SSS"]};
const backlogOf=(p,g)=>p.backlog[g].paid+p.backlog[g].waived;
/* Dated batches (dump doc: Unclaimed quests). p.batches[g] = [{d, paid, waived}], oldest first; p.backlog[g] mirrors the totals. */
function ensureBatches(p){if(!p.batches){p.batches={};for(const g of GRADES){const b=p.backlog[g]||{paid:0,waived:0};p.batches[g]=b.paid+b.waived?[{d:S.date,paid:b.paid,waived:b.waived}]:[]}}for(const g of GRADES)if(!p.batches[g])p.batches[g]=[];return p.batches}
function syncBacklog(p){for(const g of GRADES){const bs=p.batches[g]=p.batches[g].filter(b=>b.paid+b.waived>0);p.backlog[g]={paid:bs.reduce((s,b)=>s+b.paid,0),waived:bs.reduce((s,b)=>s+b.waived,0)}}}
const batchAge=b=>daysSince(b.d,S.date);
const urgentOf=(p,g)=>(ensureBatches(p)[g]||[]).filter(b=>batchAge(b)>=QS().urgentDays).reduce((s,b)=>s+b.paid+b.waived,0);
/** Take n quests from grade g, oldest batches first. Returns paid/waived counts and how many paid ones were urgent. */
function takeBatches(p,g,n,r,urgentOnly){const out={paid:0,waived:0,urgentPaid:0,urgent:0};const ud=QS().urgentDays;
  for(const b of ensureBatches(p)[g]){if(n<=0)break;const urg=batchAge(b)>=ud;if(urgentOnly&&!urg)continue;const tot=b.paid+b.waived;if(!tot)continue;const k=Math.min(n,tot);
    let pd=Math.min(b.paid,rollCount(k*b.paid/tot,r));let wv=Math.min(b.waived,k-pd);pd=k-wv;
    b.paid-=pd;b.waived-=wv;n-=k;out.paid+=pd;out.waived+=wv;if(urg){out.urgent+=k;out.urgentPaid+=pd}}
  syncBacklog(p);return out}
/** Raise plane XP; returns levels gained. */
function planeGainXp(p,xp){p.xp+=xp;let lv=0;while(p.xp>=QS().levelCost*p.level){p.xp-=QS().levelCost*p.level;p.level++;lv++}return lv}
const backlogTotal=p=>GRADES.reduce((s,g)=>s+backlogOf(p,g),0);
const activeSurgeContract=p=>S.contracts.find(c=>c.type==="surge"&&c.planeId===p.id&&c.active);
function makeOffer(o){S.offers.push({id:"o"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:S.date,status:"open",...o})}
/** End Day step 3. Adds Registry fees and surge-contract pay to `rev`. Returns report lines. */
function runQuests(rev){
  if(!isLive("quest-registry"))return [];
  const L=[],q=QS(),days=daysInMonth(S.date),planes=regPlanes();if(!planes.length)return [];
  const act=activeCount(),wsum=planes.reduce((s,p)=>s+(p.weight||0),0)||1;
  const tierShare=Object.fromEntries(TIERS.map(t=>[t,act?tierTotal(t)/act:0]));
  for(const p of planes){
    const r=rng("quests:"+p.id);
    // 1. Demand state
    if(!p.demandLocked&&r()<q.changeChance){const w={...q.transition};w[p.demand]=0;const nd=weightedPick(w,r);const was=p.demand;p.demand=nd;
      L.push(`${p.name}: demand ${DEMAND_NAME[was]} → ${DEMAND_NAME[nd]}.`);
      if(nd==="surge"){p.surgeStart=S.date;notify(`Dungeon Surge on ${p.name}`,"Postings jump and skew toward hard grades. Inn traffic rises.");
        if(r()<q.surgeContractChance[standingIdx(p.level)]){makeOffer({kind:"surge",planeId:p.id,plane:p.name,value:+(q.surgeContractPerDay*planeMult(p.level)).toFixed(2)});L.push(`${p.name}'s government offered an emergency coordination contract.`);notify(`Surge contract offer: ${p.name}`,"Accept or decline it on the Contracts tab.")}}
      if(was==="surge")for(const c of S.contracts)if(c.type==="surge"&&c.planeId===p.id&&c.active){c.active=false;c.end=S.date;L.push(`${p.name}'s surge contract ended with the surge.`)}}
    const M=planeMult(p.level),A=act*(p.weight||0)/wsum;
    // 3. Completions first, clamped to the backlog at the start of the day
    const C=q.completeFactor*A*M/days,cap={};GRADES.forEach(g=>cap[g]=0);
    for(const t of TIERS){const gs=TIER_GRADES[t];for(const g of gs)cap[g]+=C*tierShare[t]/gs.length}
    const B=Object.fromEntries(GRADES.map(g=>[g,backlogOf(p,g)])),done={},spare={};
    GRADES.forEach(g=>{done[g]=Math.min(B[g],cap[g]);spare[g]=cap[g]-done[g]});
    for(let i=0;i<GRADES.length-1;i++){const g=GRADES[i],u=GRADES[i+1];const up=Math.min(q.reachUp*cap[g],spare[g],B[u]-done[u]);if(up>0){done[u]+=up;spare[g]-=up}}
    for(let i=GRADES.length-1;i>0;i--){const g=GRADES[i],d=GRADES[i-1];const add=Math.min(spare[g],B[d]-done[d]);if(add>0){done[d]+=add}spare[d]+=spare[g]-Math.max(0,add)}
    let comp=0,paidComp=0,xp=0,urgDone=0;ensureBatches(p);
    GRADES.forEach((g,gi)=>{let n=Math.min(B[g],rollCount(done[g],r));if(!n)return;const o=takeBatches(p,g,n,r);
      comp+=o.paid+o.waived;paidComp+=o.paid-o.urgentPaid;urgDone+=o.urgent;xp+=(o.paid+o.waived)*q.planeXp[gi]});
    // 4. Then postings
    const surgeC=activeSurgeContract(p);
    const D=q.demand[p.demand]*(surgeC?1+q.surgePriority:1);
    const Q=(q.postPerActive*A+D)*M/days,n=rollCount(Q,r);
    const mix={};GRADES.forEach((g,i)=>{let w=q.gradeMix[g];if(i>=4){w*=M;if(p.demand==="surge")w*=q.surgeHighMult}mix[g]=w});
    let paidPost=0,high=0;
    for(let i=0;i<n;i++){const g=weightedPick(mix,r);const paid=r()<q.paidShare;const bs=p.batches[g];let b=bs[bs.length-1];if(!b||b.d!==S.date){b={d:S.date,paid:0,waived:0};bs.push(b)}b[paid?"paid":"waived"]++;if(paid)paidPost++;if(GRADES.indexOf(g)>=4)high++}
    syncBacklog(p);
    // 5. Registry fees

    if(surgeC&&p.demand==="surge"){rev.contracts=(rev.contracts||0)+surgeC.value;surgeC.paid=(surgeC.paid||0)+surgeC.value}
    // 6. Plane XP (new levels apply from tomorrow)

    // 7. Aging: urgent at 30 days, expired at 90 (Standing XP lost, never below the start of the level)
    let newUrg={},exp={},lost=0;
    GRADES.forEach((g,gi)=>{for(const b of p.batches[g]){const a=batchAge(b),c=b.paid+b.waived;if(!c)continue;
      if(a>=q.expireDays){exp[g]=(exp[g]||0)+c;lost+=c*q.planeXp[gi];b.paid=0;b.waived=0}else if(a===q.urgentDays)newUrg[g]=(newUrg[g]||0)+c}});
    syncBacklog(p);
    const expN=Object.values(exp).reduce((s,v)=>s+v,0);
    if(expN){const before=p.xp;p.xp=Math.max(0,p.xp-lost);p.expiredMonth=(p.expiredMonth||0)+expN;p.stats=p.stats||{posted:0,completed:0};p.stats.expired=(p.stats.expired||0)+expN;S.questExpiredMonth=(S.questExpiredMonth||0)+expN;
      L.push(`${p.name}: ${expN} unclaimed quest${expN>1?"s":""} expired (${Object.entries(exp).map(([g,v])=>`${v} ${g}`).join(", ")}); −${before-p.xp} Standing XP${before-p.xp<lost?" (held at the start of the level)":""}.`)}
    const nu=Object.values(newUrg).reduce((s,v)=>s+v,0);
    if(nu)L.push(`${p.name}: ${nu} quest${nu>1?"s":""} turned urgent (${Object.entries(newUrg).map(([g,v])=>`${v} ${g}`).join(", ")}). No verification fee; rewards +25%.`);
    if(urgDone)L.push(`${p.name}: ${urgDone} urgent quest${urgDone>1?"s":""} cleared.`);
    p.stats=p.stats||{posted:0,completed:0};p.stats.posted+=n;p.stats.completed+=comp;p.compToday=comp;p.compDate=S.date;

    if(lv){const st=standingName(p.level);L.push(`${p.name}: Guild Standing level ${p.level} (${st}).`);notify(`${p.name}: Standing ${p.level}`,`${st}. Postings and completions ×${planeMult(p.level).toFixed(2)}.`)}
  }

}

const REVNAME={merch:"Public merch",dues:"Dues",registry:"Registry fees",waystones:"Waystone fares",inn:"Inn",shop:"Shop",downs:"Phoenix Downs",journeys:"Hero's Journeys",medical:"Medical",housing:"Housing",contracts:"Contracts"};

function allocation(){const ps=regPlanes(),w=ps.reduce((s,p)=>s+(p.weight||0),0)||1,a=activeCount(),t=trialCount();return Object.fromEntries(ps.map(p=>[p.id,{A:a*(p.weight||0)/w,T:t*(p.weight||0)/w,p}]))}
/** Which fare types are possible from the installed, operational stones. */
function fareTypes(){
  const ok=S.planes.map(p=>({p,ws:p.waystones.filter(w=>w.status!=="damaged")}));
  const worldCounts=[],hubPlanes=new Set();let longOk=false;
  for(const {p,ws} of ok){const byWorld={};for(const w of ws){byWorld[w.world||p.name]=(byWorld[w.world||p.name]||0)+1}worldCounts.push(...Object.values(byWorld));
    const hubWorlds=new Set(ws.filter(w=>w.hub).map(w=>w.world||p.name));if(hubWorlds.size>=2)longOk=true;if(hubWorlds.size)hubPlanes.add(p.id)}
  const local=worldCounts.some(n=>n>=2);
  return {nearby:local,regional:local,long:longOk,inter:hubPlanes.size>=2};
}
const tierDues=()=>{const d=RV().dues,ch=RV().cheaperShare;const out={...d};out.Mythic=d.Mythic*(1-ch)+d.Champion*ch;out.Ascendant=d.Ascendant*(1-ch)+d.Mythic*ch;return out};
const catalogItems=()=>S.projects.filter(p=>p.status==="live"&&p.category==="Item");
const ownersTotal=()=>S.housing.neighborhoods.reduce((s,n)=>s+n.occ.apt+n.occ.S+n.occ.M+n.occ.L,0);
const UNIT_TYPES=["apt","S","M","L"];
const UNIT_NAME={apt:"apartment",S:"small home",M:"medium home",L:"large home"};
function hoodCap(n){const f=1+RV().housing.perVersion*Math.max(0,(n.version||1)-1);const b=RV().housing.plots;return {apt:Math.round(RV().housing.apartments*f),S:Math.round(b.S*f),M:Math.round(b.M*f),L:Math.round(b.L*f)}}
const hoodFree=(n,u)=>hoodCap(n)[u]-n.occ[u];
const unitPrice=(n,u)=>RV().housing.prices[u]*(n.mythic?RV().housing.mythicMult:1);
function addNeighborhood(theme,mythic,projectId){S.housing.neighborhoods.push({id:"h"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),theme,mythic:!!mythic,projectId,occ:{apt:0,S:0,M:0,L:0},version:1,since:S.date});log(`New neighborhood on the Housing Plane: ${theme}${mythic?" (Mythic, 1.5× prices)":""}.`,"Guild")}
function pickHood(u,r,exclude){const w={};for(const n of S.housing.neighborhoods){if(n===exclude)continue;const f=hoodFree(n,u);if(f>0)w[n.id]=f*(n.mythic?.5:1)}const id=weightedPick(w,r);return id?S.housing.neighborhoods.find(n=>n.id===id):null}
/** Housing sim: buyers, moves and lapse timers. Adds revenue and refunds. */
function runHousing(rev,exp,r){
  const h=S.housing,H=RV().housing,days=daysInMonth(S.date),L=[];if(!h.neighborhoods.length)return L;
  let sold=0,soldCr=0;
  const buy=(u)=>{const n=pickHood(u,r);if(!n)return false;n.occ[u]++;const pr=unitPrice(n,u);rev.housing=(rev.housing||0)+pr;sold++;soldCr+=pr;return true};
  // waitlisted buyers go first
  for(const k of ["apt","home"]){let w=h.waitlist[k]||0;while(w>0){const u=k==="apt"?"apt":weightedPick(H.sizeWeights,r);if(!buy(u))break;w--}h.waitlist[k]=w}
  const elig=Math.max(0,activeCount()-ownersTotal());
  const nApt=rollCount(elig*H.aptRate/days,r),nHome=rollCount(elig*H.homeRate/days,r);
  for(let i=0;i<nApt;i++)if(!buy("apt"))h.waitlist.apt=(h.waitlist.apt||0)+1;
  for(let i=0;i<nHome;i++){const u=weightedPick(H.sizeWeights,r);if(!buy(u))h.waitlist.home=(h.waitlist.home||0)+1}
  if(sold)L.push(`Housing: ${sold} sold for ${fmtCr(soldCr)}.`);
  // moves and upgrades
  const owners=ownersTotal(),movers=rollCount(owners*H.moveRate/days,r);let moved=0;
  for(let i=0;i<movers;i++){const from=weightedPick(Object.fromEntries(h.neighborhoods.flatMap(n=>UNIT_TYPES.map(u=>[n.id+"|"+u,n.occ[u]]))),r);if(!from)break;
    const [nid,u]=from.split("|"),n0=h.neighborhoods.find(n=>n.id===nid);const up=r()<H.upgradeShare&&u!=="L";const to=up?{apt:"S",S:"M",M:"L"}[u]:u;
    const n1=pickHood(to,r,up?null:n0);if(!n1)continue;n1.occ[to]++;n0.occ[u]--;const pr=unitPrice(n1,to),ref=unitPrice(n0,u)*H.refund;
    rev.housing=(rev.housing||0)+pr;exp.housingRefunds=(exp.housingRefunds||0)+ref;moved++}
  if(moved)L.push(`Housing: ${moved} owner${moved>1?"s":""} moved or upgraded.`);
  // lapse timers
  h.lapseTimers=h.lapseTimers.filter(tm=>{if(r()<SUB().resub/days){return false}
    if(daysSince(tm.startDate,S.date)>=H.graceDays){const n=h.neighborhoods.find(x=>x.id===tm.hood);if(n&&n.occ[tm.unit]>0){n.occ[tm.unit]--;exp.housingRefunds=(exp.housingRefunds||0)+unitPrice(n,tm.unit)*H.refund;L.push(`A lapsed owner's ${UNIT_NAME[tm.unit]} in ${n.theme} was released after 6 months; their things went to Housing Storage.`)}return false}return true});
  return L;
}
/** Owners among tonight's churned members start a 180-day timer. */
function housingOnChurn(n,r){const own=ownersTotal(),act=activeCount()+n;if(!own||!n)return;const k=rollCount(n*own/Math.max(1,act),r);
  for(let i=0;i<k;i++){const from=weightedPick(Object.fromEntries(S.housing.neighborhoods.flatMap(h=>UNIT_TYPES.map(u=>[h.id+"|"+u,h.occ[u]-S.housing.lapseTimers.filter(t=>t.hood===h.id&&t.unit===u).length]))),r);if(!from)break;const [hood,unit]=from.split("|");S.housing.lapseTimers.push({hood,unit,startDate:S.date})}}
/** End Day step 4. Fills `rev` (earned) and `exp` (direct costs). Returns report lines. */
function runRevenue(rev,exp){
  const L=[],v=RV(),days=daysInMonth(S.date),r=rng("revenue"),act=activeCount(),trial=trialCount(),elig=act+trial;
  // Dues
  if(isLive("membership-and-subscriptions")&&!(S.stage==="closedBeta"&&v.closedBetaFree)){const td=tierDues();let d=0;for(const t of TIERS)d+=tierTotal(t)*td[t];d=d*(1-v.billingDiscount)/days;if(d>0)rev.dues=d}
  // Waystones
  if(isLive("waystones")){const ft=fareTypes(),w={nearby:ft.nearby?v.waystones.weights.nearby:0,regional:ft.regional?v.waystones.weights.regional:0,long:ft.long?v.waystones.weights.long:0,inter:ft.inter?v.waystones.weights.inter:0};
    const tot=Object.values(w).reduce((s,x)=>s+x,0);
    if(tot>0){const f=v.waystones.factorMin+r()*(v.waystones.factorMax-v.waystones.factorMin);const trips=rollCount(elig*v.waystones.tripsPerMember/days*f,r);let cr=0;
      for(const k in w)if(w[k]){const n=rollCount(trips*w[k]/tot,r);cr+=n*v.waystones.fares[k]}
      if(cr){rev.waystones=cr;L.push(`${fmtN(trips)} Waystone trips.`)}}}
  // Inn
  if(isLive("guild-inn-and-tavern")){const al=allocation();let food=0,rooms=0;
    for(const id in al){const {A,T,p}=al[id];if(!p.innDoor)continue;const tf=v.inn.traffic[p.demand]||1;food+=(A+T)*v.inn.food*tf;rooms+=(A+T)*v.inn.rooms*tf}
    const fN=rollCount(food,r),rN=rollCount(rooms,r);let fCr=0,rCr=0;
    for(let i=0;i<fN;i++)fCr+=v.inn.foodPrices[weightedPick(v.inn.foodWeights,r)];
    for(let i=0;i<rN;i++)rCr+=v.inn.roomPrices[weightedPick(v.inn.roomWeights,r)];
    if(fCr+rCr){rev.inn=fCr+rCr;const c=v.inn.costs;exp.innCosts=fCr*(c.ingredients+c.supplies)+(fCr+rCr)*c.mana+rCr*c.linens;L.push(`Inn: ${fN} food orders, ${rN} room-nights.`)}}
  // Shop
  if(isLive("guild-shop")){const items=catalogItems();let shop=0;
    const newOnes=items.filter(p=>p.deployedOn&&daysSince(p.deployedOn,S.date)<v.shop.newDays);
    if(items.length){const rate=(v.shop.base+v.shop.lnCoef*Math.log(1+items.length))*(newOnes.length?1+v.shop.newBoost:1);const n=rollCount(elig*rate/days,r);
      const byRar={};for(const p of items){const w=newOnes.includes(p)?v.shop.newWeight:1;byRar[p.rarity]=(byRar[p.rarity]||0)+w}
      const rw={};for(const k in byRar)rw[k]=v.shop.rarityWeights[k]||0;
      let jeffShop=0;for(let i=0;i<n;i++){const k=weightedPick(rw,r);if(!k)continue;shop+=v.shop.prices[k];
        const pickW={};for(const p of items)if(p.rarity===k)pickW[p.id]=newOnes.includes(p)?v.shop.newWeight:1;const it=S.projects.find(p=>p.id===weightedPick(pickW,r));if(it&&it.cardId==="jeff-plush")jeffShop+=v.shop.prices[k]}
      if(jeffShop)rev._jeff=(rev._jeff||0)+jeffShop;
      if(n)L.push(`Shop: ${n} purchases from ${items.length} item${items.length>1?"s":""}.`)}
    shop+=ownersTotal()*v.shop.housingCosmetic/days;
    let coupons=0;for(const t of TIERS)coupons+=tierTotal(t)*v.shop.coupons[t]*v.shop.redeem/days;
    shop=Math.max(0,shop-coupons);if(shop)rev.shop=shop}
  // Public merch: 0.1 Cr × merch versions × operational Hub Waystones a day
  {const mv=liveMerch().reduce((s,p)=>s+p.version,0),hubs=hubCount();if(mv&&hubs){const pm=S.settings.merch.publicPerVersionHub*mv*hubs;rev.merch=pm;
    const jp=liveMerch().filter(p=>p.cardId==="jeff-plush").reduce((s,p)=>s+p.version,0);if(jp)rev._jeff=(rev._jeff||0)+pm*jp/mv}}
  if(rev._jeff){const cut=rev._jeff*S.settings.merch.jeffShare;S.jeff.balance+=cut;S.jeff.plushEarned+=cut;exp.jeffRoyalty=(exp.jeffRoyalty||0)+cut;delete rev._jeff}
  // Phoenix Downs
  if(isLive("phoenix-downs")){const n=rollCount(act*v.downs.share/days,r);if(n)rev.downs=n*v.downs.price}
  // Hero's Journeys: each tracked on its own (launch wave, then ongoing sales)
  if(isLive("membership-and-subscriptions"))L.push(...runJourneys(rev,act,trial,days,r));
  // Medical [default: with the Inn's clinics]
  if(isLive("guild-inn-and-tavern")){const m=act*v.medical/days;if(m)rev.medical=m}
  // Housing
  if(isLive("housing-plane"))L.push(...runHousing(rev,exp,r));
  // Version bonus: once, to dues and Shop
  const vb=versionBonus().value;if(vb){if(rev.dues)rev.dues*=1+vb;if(rev.shop)rev.shop*=1+vb}
  return L;
}
